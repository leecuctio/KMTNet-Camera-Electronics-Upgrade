; gmon v2 설정 — 키 정의와 의미는 DESIGN.md §4 참조
; 커미셔닝 때 재확인할 항목은 DESIGN.md §10 / README.md 체크리스트 참조

[site]
name = SSO
night_offset_hours = -8

[paths]
runroot   = run
configdir = config
python    = /opt/miniconda3/bin/python
sex       = sex
psfex     = psfex
gnuplot   = gnuplot
ds9       = ds9
xpaset    = xpaset

[watch]
pattern        = *.fits
poll_sec       = 2
settle_sec     = 2
delete_raw     = no

[geometry]
raw_nx        = 4224
raw_ny        = 1033
nseg          = 8
seg_width     = 528
left_active   = 16,528
right_active  = 0,512
y_trim_bottom = 9
y_trim_top    = 0
flip_right_x  = no
pedestal_match = yes

[chips]
order  = n,s,e,w
prefix = KMTNg

[pipeline]
pixel_scale   = 0.52
min_fwhm_px   = 1.0
stat_region   = 10,500,70,970

[display]
backend = auto
rot_n = 90
rot_e = 180
rot_w = 0
rot_s = 270
zoom  = 16

[plot]
term        = qt
size        = 800,380
refresh_sec = 10
y_fwhm_max  = 12
y2_range    = -8.0,-5.0

[focus]
slope     = -0.067
base      = 5.56
dfocus    = 0.000
step      = 0.005
big_step  = 0.5
safe_min  = -8.0
safe_max  = -5.0
max_jump  = 0.1
period_sec = 120

[ics]
mode     = file
host     = 192.168.13.109
port     = 6660
dry_run  = yes
