#
# KMTNet TCS Agent runtime config file
#
# Note that while mixed cases are used for readability, entries
# are case insensitive *EXCEPT* for network hostnames or Unix
# filenames.  Beware!
#
# R. Pogge, OSU Astronomy Dept.
# pogge@astronomy.ohio-state.edu
# 2005 May 27 (Original version - Yale1m)
#
# S. Cha, KASI KMTNet team
# chasm@kasi.re.kr
# 2014 April 1 (KMTNet version)
#
# - System: OSU Dev.sys
# - last update: 2014-04-30
#
###########################################################################

# Application Mode: either STANDALONE or ISISclient
Mode Standalone
#Mode ISISclient

# ISIS Server Info - only releveant if Mode=ISISclient
ISISID    IS
ISISHost  localhost
ISISPort  6600

# TCS Agents ISIS client info (Host=localhost is implicit)
ID    TC
Port  6606

# TCS server (PCTCS Telcom) info
TCS_Host  cpsi-tcs      (not working..)
TCS_Host  172.16.13.36  (KMTNet Dev.sys @ OSU)
TCS_Host  127.0.0.1     (for debugging)
TCS_Port   5750
TCS_TelID  KMTNET
TCS_SysID  TCS

# AUX control server info
AUX_Host  cpsi-tcs      (not working..)
AUX_Host  172.16.13.36  (KMTNet Dev.sys @ OSU)
AUX_Host  172.16.0.254  (for debugging)
AUX_Port   5752
AUX_TelID  KMTNET
AUX_SysID  AUX

# Timeout setting for Telcom tcp and PC-TCS serial link (in second)
Timeout_PCTCS   5
Timeout_Telcom  7

# TCS & AUX telemetry update interval (in second)
UpdateInt_TCS  1.0
UpdateInt_AUX  0.2

# TCS & AUX TCP Links auto recovery mode setting (on/off)
AutoRecovery_TCS  off
AutoRecovery_AUX  off

# TCS & AUX TCP Links auto recovery try interval (in seconds)
ArcInt  2.0

# TCS HW configuration
TCS_Guide_Step_RA       0.00503608  (in arcsec/encoder_count)
TCS_Guide_Step_Dec      0.01321939  (in arcsec/encoder_count)
TCS_Guide_MinOff_RA     0.01        (in arcsec, minimum RA guiding offset)
TCS_Guide_MinOff_Dec    0.02        (in arcsec, minimum Dec guiding offset)
AUX_FS_Filter_OpTime    8.0         (in seconds, filter slide operation time)
AUX_FS_Shutter_OpTime   5.0         (in seconds, camera shutter opening time)
AUX_FA_ActNum_South     2           (south actuator number)
AUX_FA_ActNum_East      1           (east actuator number)
AUX_FA_ActNum_West      3           (west actuator number)

# TCS Agent client application runtime flags (on/off)
VERBOSE  on
DEBUG    off
DOLOG    off

# TCS Agent log file path
LOGFILE  "/data/Logs/pctcs.log"  (default)

# END
