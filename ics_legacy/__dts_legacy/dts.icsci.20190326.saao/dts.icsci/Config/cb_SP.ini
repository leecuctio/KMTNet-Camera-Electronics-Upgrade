#
# Caliban Runtime Initialization File
#
# Linux/SCSI version, v3.2.0
# ISIS network server interface
# KMT System with ISIS relay
#
# R. Pogge, OSU Astronomy Dept.
# pogge.1@osu.edu
# Modified: 2014 Oct 9
#
# FOR KMTN "Spare" IC
#
LOCAL_HOST SP.CB
LOG_FILE_NAME /lhome/data/Logs/Caliban/Caliban.log
#
# data-transfer disk server interface
# uses the ISIS server network socket for communications
#
DISK_HOST SP.IC
DISK_INTERFACE SOCKET
#
# Serial Port info
#
# none in this config
#SERIAL_PORT /dev/ttyS0
#
# ISIS Server Info
# This is the "executive" ISIS server on the science machine
#
SERVER_HOST XIS
SERVER_IP 192.168.13.109
SERVER_PORT 6660
#
# Caliban network client port
#
LOCAL_PORT 10601
#
# Data Transfer Disks
#
SPOOL_DEVICE /dev/ram0
SPOOL_DEVICE /dev/ram1
#
# Local Mount Points
#
#MOUNT UNIX:\CB\/mnt/electrondata
MOUNT UNIX:\CB\/mnt/ICSData

#
# Post-processing functions
#
# Always do this
#
ADDFITS
#
# Data Logging (not done here for KMT, elsewhere...)
#
#DOAUTOLOG
#AUTOLOG_CMD /lhome/obspkg/bin/autologger %s
#
# additional runtime configuration settings
#
BLOCK_SIZE 8192
MAX_XFER_FILES 150
DBG_HEADLNG 32
DBG_DATALNG 8542
TIMEOUT 150
ACKSWAP
#
# uncomment these for engineering, or
# set interactively with +verbose and +debug
#
VERBOSE
#DEBUG
#
