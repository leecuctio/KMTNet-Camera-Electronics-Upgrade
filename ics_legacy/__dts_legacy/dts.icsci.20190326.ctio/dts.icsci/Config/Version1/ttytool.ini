################################################################

# ttytool's ISIS client info (Host=localhost is implicit)

ID   TTY
Port 20702

# Application Mode: either STANDALONE or ISISclient

Mode Standalone
#Mode ISISclient

# ISIS Server Info - only releveant if Mode=ISISclient

ISISID   IS
ISISHost 172.16.1.240
ISISPort 6600

# Serial (TTY) port parameters
#
# syntax: 
#   TTYPORT /dev/ttyS0  --> physical tty port
#   TTYPORT /dev/pty01  --> pseudoTTY port
#   TTYPORT 172.16.1.63:8000 --> Comtrol RTS TCP port
# If a physical port, also set port attributes
#   SPEED 9600
#   DATABITS 8
#   STOPBITS 1
#   PARITY 0

TTYPORT 172.16.1.63:8000

#TTYPORT /dev/cua0
#SPEED 9600
#DATABITS 8
#STOPBITS 1
#PARITY 0

# ttytool client application runtime flags

VERBOSE
#nolog
#debug
