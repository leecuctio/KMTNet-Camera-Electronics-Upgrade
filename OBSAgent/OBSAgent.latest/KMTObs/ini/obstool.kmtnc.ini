###########################################################################

## Application Mode: either STANDALONE or ISISclient

#Mode Standalone
Mode ISISclient

## ISIS Server Info - only releveant if Mode=ISISclient
## Changed to V2 Executive ISIS Server [rwp/osu - 2014 Dec 12]

ISISID    XIS
ISISHost  192.168.14.109
ISISPort  6660

## OBS Agents ISIS client info (Host=localhost is implicit)

ID    OBS
Port  6650

## System specification and TCS limit position configuration

# CTIO instrument control system settings
ICS_DATASOURCE   CTC

# CTIO Telescope position
TCS_LATITUDE         -30.167222    # deg N  ( -30:10:02.0)
TCS_LONGITUDE         70.804000    # deg W  (  70:48:14.4)
TCS_ELEVATION       2167           # meter

# CTIO TCS pointing/tracking tolerance
#TCS_TOLERANCE_POINTING     0.2   # arc-sec, increasing when try num increasing
 TCS_TOLERANCE_POINTING     2.0   # adjusted tomporary: 0.2 --> 2.0 on 20230607
 TCS_TOLERANCE_TRACKING     0.5   # arc-sec
 TCS_UNSTABLE_HYSTERESIS    2     # for checking RA/DEC axes oscillation (Typ. 2-3)
 ## Note: adjust TCS_TOLERANCE_POINTING in case frequent "failed to point at the RA / the DEC or Both RA/DEC"
 ## Note: adjust TCS_TOLERANCE_TRACKING in case frequent "failed to point due to OSCILLATION .."

# CTIO TCS limit configuration updated in 2017.12
TCS_LIMIT_HA           4.64    # hour (04:38:24)
TCS_LIMIT_DEC_N      +23.00    # deg  (Alt 36.8 on Merdian)
TCS_LIMIT_DEC_S      -79.00    # deg  (Alt 41.2 on Merdian)
TCS_LIMIT_SECZ         2.37    # secZ (Alt=25)
TCS_LIMIT_ALT         25.00    # deg  (Alt=25)
TCS_LIMIT_WARNING      1.25    # deg  (5 min)

## TCS Agent client/agent application runtime flags (on/off)

VERBOSE     off    # display verbose message on console
DEBUG       off    # display debug message on console
DOLOG       on     # log event messages on the 'event' log
DBGLOG      on     # log debugging messages on the 'debug' log, making another log file for debugging log
OBSLOG      on     # log script obs results on the 'scrobs' log, making another log file for script obs log
LOGVER      on     # log verbose messages on the 'event' log
TIMETAG     on     # time tag display on console

## TCS Agent log/output/import file path

LOGFILE  /data/Logs/OBS/obs           # default, directory and prefix of log files
#SCRIPT  /data/osc/default.osc        # default for initialy loading
#SCRIPT  /home/dts/osc/default.osc    # default for initialy loading
#SCRIPT  osc/test.osc                 # for test and debugging
#SCRIPT  no                           # initialy loading not used

## END
