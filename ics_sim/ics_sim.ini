# ics_sim.ini -- KMTNet ICS simulator configuration
#
# 주석 문자는 '#' 하나이며 줄 어디에나 쓸 수 있다. '#' 앞의 내용은 유효하다.
#   erase_sec = 7.24   # 이렇게 값 뒤에 붙여도 된다
# 값의 근거가 되는 절 번호는 DevNote.md를 가리킨다.
#
# CLI 인자는 같은 키를 덮어쓴다:  python -m ics_sim --time-scale 0.1

[node]
observatory     = TESTBED              # **사이트를 정하는 단일 권위** (FITS OBSERVAT)
                                        #   CTIO | SSO | SAAO | TESTBED  넷뿐이고,
                                        #   **적은 값이 그대로 OBSERVAT 카드**가 된다.
                                        #   여기서 사이트 코드가 유도된다:
                                        #     CTIO->KMTC  SSO->KMTA  SAAO->KMTS  TESTBED->KMTT
                                        #   그 코드가 파일명 <SITE> · 좌표([site.*]) ·
                                        #   ORIGIN · INSTRUME('<SITE> 18k CCD') 를
                                        #   **함께** 끌고 간다 (D-011, raw spec 2.3절).
                                        #   ⚠️ 모르는 값이면 **기동을 거부**한다.
                                        #   ⚠️ 종전의 호스트 IP 판정(site_from_ip, D-015)은
                                        #      폐지됐다 -- 이 줄이 정본이다
ics_id          = ICS
ic_ids          = K.IC, M.IC, T.IC, N.IC
cb_ids          = K.CB, M.CB, T.CB, N.CB
master          = K                     # readout 진행률(PCTREAD)을 보고하는 master CCD
guide_ic_id     = G.IC                  # INITIALIZE만 보낸다. ICG 자체는 범위 밖
emit_node_mode  = legacy                # legacy = 노드별 발신 / merged = 전부 ICS 이름
                                        # DevNote 3.1: 둘 다 OBSAgent 필터를 통과해야 한다

[transport]
bind_host       = 127.0.0.1             # 외부 장비(XIS/OBSAgent)와 붙이려면 0.0.0.0
bind_port       = 6600                  # 레거시 IC 계열 관례 포트. 같은 호스트에
                                        # 실제 K.IC 가 있으면 충돌하니 주의
xis_host        =                       # 비우면 direct-reply 모드 (수신 주소로 되돌려보냄)
xis_port        = 6660                  # CTIO 기준 (OBSAgent ISISPort 6660)
send_gap_ms     = 2                     # rate-limited 발신 큐 간격. 레거시 dispatcher 패턴
peer_ttl_sec    = 3600                  # 학습한 피어 주소 유효시간
register_all_nodes = true               # 기동 시 9개 노드 ID 전부로 PING (DevNote 3.1.1)
                                        # false 면 ICS 만 등록 -> kstatus/dmawait/
                                        # datasource 가 도달하지 않는다
broadcast_dedup_sec = 2.0               # 같은 AL 브로드캐스트 원문이 이 시간 안에 또 오면
                                        # XIS 슬롯별 복사본으로 보고 버림 (DevNote 3.1.2)
                                        # 0 이하면 끔

[paths]
data_dir        = ./icsdata             # 단일 저장 경로. 레거시 DISK0~3 링은 폐지 (DevNote 6.2)
write_fits      = false                 # true면 astropy로 더미 FITS 생성
fits_shape      = 256, 256              # chip 당 더미 이미지 크기 (행, 열).
                                        #   'spec' 이면 raw spec 실물 기하 --
                                        #   chip 9400x9600, 파일 19200x9400 (344 MiB),
                                        #   amp tile/overscan 구조 포함 (4장)
expnum_file     =                       # 마지막으로 쓴 EXPNUM 기록 파일. 비우면 이 설정파일 옆에
                                        #   같은 이름 .expnum 으로 자동 (~/AIC/Config/ics_sim.expnum).
                                        #   재실행하면 그 +1 부터 쓴다 -- data_dir 을 비워도
                                        #   번호는 되돌아가지 않는다 (DevNote 11.12)

# ---------------------------------------------------------------------------
# 사이트 측지값 -- FITS LATITUDE / LONGITUD / ELEVATIO / TELESCOP (규격 5.9절)
# ---------------------------------------------------------------------------
#
# **[node] site 를 바꾸면 좌표까지 따라온다.** 아래 [site.<코드>] 중 [node] site
# 에 해당하는 섹션이 자동으로 쓰인다. 그래서 SAAO 에 배포할 때 site 한 줄만
# 고치면 되고, 좌표를 같이 고치는 것을 잊어 **CTIO 좌표가 SAAO 자료에 아무
# 경고 없이 박히는** 일이 생기지 않는다.
#
# [site] 섹션에 값을 쓰면 선택된 사이트 섹션을 **덮는다** -- 현장이 정본이므로
# 값을 정정할 때 쓴다. 아무것도 없으면 rawhdr.VERIFIED_SITES 가 기본값이다.
#
# ⚠️ LONGITUD 는 **서경([deg W]) 양수**다. 레거시 관례이고 세 사이트 값으로
#    규약이 확인된다:
#        CTIO  +70:48:14.39  =  70.804 W   (동경 -70.804)
#        SAAO   339:11:22    = 339.189 W   (동경 +20.810)
#        SSO    210:56:08    = 210.936 W   (동경 +149.064)
#    CTIO 만 90 미만이라 + 부호가 붙고 나머지는 0~360 이라 형태가 달라 보이지만
#    규약은 같다. "왜 339도?" 하고 동경으로 고치면 부호가 뒤집힌 좌표가
#    아카이브에 영구히 박힌다 -- 겉보기엔 유효한 좌표라 아무도 의심하지 않는다.
#
# ⚠️ 값 문자열을 **그대로** 싣는다 (초의 소수점 자리·+ 부호 유무 포함).
#    정규화하면 레거시 아카이브와의 문자열 비교가 깨진다.
#
# 값 출처: 운영자 확인 (2026-08-13). 규격 OI-11.

# 사이트 판정은 **호스트 IP 대역**이 정본이고 아래 site 값을 이긴다 (D-015).
#   192.168.14.x -> CTIO(KMTC)   192.168.13.x -> SAAO(KMTS)
#   192.168.15.x -> SSO(KMTA)    그 밖 전부   -> 벤치(KMTT)
# 어긋나면 기동 시 경고가 뜬다. 벤치라면 site = testbed 로 맞춰 두면 조용해진다.
# site_from_ip = false 로 끌 수 있다 (시험이 그 경로를 쓴다).

[site.ctio]
telescop        = KMTNet 1.6m \#1     # '\#' 로 적을 것 -- 공백 뒤 '#' 는 인라인 주석으로 잘린다
latitude        = -30:10:01.84
longitud        = +70:48:14.39
elevatio        = 2140

[site.saao]
telescop        = KMTNet 1.6m \#2     # '\#' 로 적을 것 -- 공백 뒤 '#' 는 인라인 주석으로 잘린다
latitude        = -32:22:42
longitud        = 339:11:22
elevatio        = 1800

[site.sso]
telescop        = KMTNet 1.6m \#3     # '\#' 로 적을 것 -- 공백 뒤 '#' 는 인라인 주석으로 잘린다
latitude        = -31:16:24
longitud        = 210:56:08
elevatio        = 1150

[site.testbed]
# 테스트베드는 실재 좌표가 없다. **일부러 비워 둔다** -- 아무 좌표나 넣으면
# 시험 산출물이 실제 관측처럼 보인다. sentinel('NC' / -1)이 실린다.
telescop        =
latitude        =
longitud        =
elevatio        =

[site]
# 선택된 [site.<코드>] 를 덮어쓸 때만 채운다. 보통은 비워 둔다.
telescop        =
latitude        =
longitud        =
elevatio        =
origin          =                       # FITS ORIGIN 덮어쓰기. 비우면 사이트 유도
                                        #   (관측소 raw=관측소명, 테스트베드=KASI --
                                        #   운영자 확정 2026-08-21). [site.<코드>] 에도 쓸 수 있다

[camera]
# Source 가 'ICS INI' 인 instrument 카드 (Header_and_Refs 3.3절, 운영자 지시
# 2026-08-22). 비우면 코드 기본값을 쓴다.
detector        =                       # FITS DETECTOR. 기본 'e2v CCD290-99'
camver          =                       # FITS CAMVER. 기본 'CEU-v2.1'.
                                        #   ⚠️ HW·성능상 변경이 있을 때만 올린다 --
                                        #   전자부 세대 판단의 참조점 (Header_and_Refs 3.3절)
instrume        =                       # FITS INSTRUME. 기본 '<SITE> 18k CCD'
fpaid           =                       # FITS FPAID (검출기 조립 정체). 기본 'FPA#1'

[controllers]
# 과학 컨트롤러 정체 (FITS CTRL1*/CTRL2* -- 'ICS INI' 카드). 비우면 백엔드
# 보고값(sim 은 SIM 더미, 실기는 Archon SYSTEM 응답)을 쓰고, 채우면 INI 가
# 이긴다. 실값 원자료: raw_fits_spec/__reference/Archon_Unit_Info.txt
# (ID 숫자 = IP). ctrl<n>_cfg 는 적용된 Archon 설정 파일명(CTRL<n>CFG 카드) --
# 타이밍·바이어스·클럭 버전 문자열이 이 파일로 귀속된다 (Header_and_Refs 3.3절).
# ⚠️ 색인 1 = MK, 2 = NT.  "없음" 은 **비워 두거나 NC** 이고, 어느 쪽이든
#    **카드는 빼지 않고 값에 규격 5.0절 sentinel 'NC' 가 실린다**
#    (운영자 확정 2026-08-25).
# ⚠️ **색인이 태그를 정한다 -- 이름 문자열은 읽지 않는다.**  색인 1 = ctrl1_* =
#    무조건 MK, 색인 2 = ctrl2_* = 무조건 NT.  이름 끝 번호(101/103/104…)는
#    유닛마다 다르고 색인과 관계없다 (운영자 확정 2026-08-25).
ctrl1_id        =                       # 예: KMTA-SCI-101 (번호는 유닛마다 다르다)
ctrl1_sn        =                       # 예: STA-0288
ctrl1_cfg       =                       # 예: KMTA_SCI_101_R2609.1.acf
ctrl2_id        =                       # 예: KMTA-SCI-104 (번호는 유닛마다 다르다)
ctrl2_sn        =                       # 예: STA-0289
ctrl2_cfg       =                       # 예: KMTA_SCI_102_R2609.1.acf
rdmode          =                       # FITS RDMODE (독출 모드 선언). 기본 'NORMAL'.
                                        #   MEF READMODE('64AMP', 구조 선언)와 별개다

[timing]
# 단위 초. 전부 XIS 로그 실측 중앙값 (DevNote 4장)
time_scale          = 1.0               # 전체 축척. 테스트는 0.02 등. [obsagent] 창은 축척 제외
go_to_initializing  = 0.81              # go 접수 -> EXPSTATUS=INITIALIZING
initialize_ack      = 0.40              # INITIALIZE -> IC의 Initialization Complete.
erase_sec           = 7.24              # ERASE -> Erase Cycle Complete.
aux_relay_gap       = 0.058             # 4개 IC로 AUXSTATUS 중계 간격
tcs_relay_gap       = 0.029             # 4개 IC로 TCSSTATUS 중계 간격
shutter_open_delay  = 0.15              # SHOPEN -> Shutter=Open
aux_requery_after_shopen = 3.0           # SHOPEN 후 이 시간에 AUXSTATUS 재질의 ->
                                        #   헤더의 SHUTTER/SHUTOP 를 노출 중 값으로
                                        #   갱신한다. 0 이하면 갱신 안 함.
                                        #   ⚠️ 3초는 블레이드 주행(5초) 중간이라
                                        #   SHUTOP=OPENING 이다. 벤치 실측으로
                                        #   조정할 값 (규격 OI-13)
countdown_tick_dark = 5.00              # DARK/BIAS: ICS의 "Remaining=N sec. of M sec."
countdown_tick_shop = 5.217             # OBJECT: K.IC의 "Integration Remaining=N sec."
shutter_to_readout  = 6.00              # Shutter=Closed -> EXPSTATUS=READOUT
acq_to_idle         = 0.40              # 4번째 Acquisition Complete. -> EXPSTATUS=IDLE
                                        #   [obsagent] force_idle/2 (~0.9s) 안에 들어와야 한다
write_delay         = 3.40              # 획득 완료 -> Wrote
ccd_skew            = 0.0, 0.6, 0.7, 1.6    # 저장 완료 시차. ccd_skew_order 순서로 적용
ccd_skew_order      = N, T, M, K
tc_query_timeout    = 0.50              # TC AUXSTATUS/TCSSTATUS 응답 대기
tc_timeout_mode     = passthrough       # passthrough = 빈 필드로 중계 (레거시 실측, DevNote 6.5)
                                        # canned      = 내장 텔레메트리로 대체

[readout]
# PCTREAD 진행률 모델. 실측: 6 -> 17 -> ... -> 94 (9틱, +11씩) -> 100
pctread_start   = 6
pctread_step    = 11
pctread_tick    = 3.37
pctread_final   = 100                   # 도달 시 "Acquisition Complete. Disk Transfer Starting."

# --- Acquisition Complete. 를 컨트롤러 프레임별로 낼지 (목 지시 2026-08-24) ---
# false(기본) = 4개를 **같은 이벤트 루프 틱**에 낸다 -- 산포가 사실상 0 이라
#   1.8초 창(force_idle)이 구조적으로 보장된다.  이것이 종전 거동이다.
# true       = 컨트롤러가 끝나는 대로 그 chip 몫을 낸다.  얻는 것은 관측자가
#   "MK 는 끝났고 NT 가 아직" 을 보는 것뿐이고, 대신 4개의 산포가 **두
#   컨트롤러의 실제 시차**가 되어 그 보장이 없어진다.  OBSAgent 는 4개가 언제
#   왔는지를 창 검사 외에는 쓰지 않는다.
#   ⚠️ **실기 시차 실측 뒤에 켤지 정한다** (tools/probe_archon.py 3단계).
acq_per_frame   = false
acq_skew_warn   = 1.0                   # 첫 완료 뒤 나머지가 이 시간 안에 안 오면
                                        #   경고 [s].  1.8초 창보다 안쪽에 둔다 --
                                        #   창을 깨기 전에 알아야 한다.  스위치가
                                        #   꺼져 있어도 시차는 잰다(실측 근거)

[obsagent]
# OBSAgent(commands.c/main.c)의 상수. 시뮬이 직접 쓰진 않고,
# 기동 시 [timing] 값이 이 창을 침범하지 않는지 자가검증하는 데 쓴다 (DevNote 3.3)
tick_sec        = 0.045
force_idle      = 40                    # ~1.8 s : Acquisition Complete. 1번째 -> 4번째
force_ready     = 270                   # ~12.2 s : IDLE_3 -> READY
force_fitssaved = 560                   # ~25 s : IDLE_3 -> 4번째 Wrote

[behavior]
strict_legacy   = true                  # 남은 스텁(BIN)을 무응답 처리 (DevNote 9.2)
                                        # STOP/ABORT 는 구현됨, ROI/DISPL/MOVIE 는 항상
                                        # Didn't understand 거부 (DevNote 6.8)
bug_compat      = false                 # true면 레거시 커맨드워드 오염을 의도적으로 재현 (DevNote 5장)
send_guide_init = true                  # ICS>G.IC INITIALIZE 발신 여부
console         = true                  # stdin 키보드 인터페이스 사용
inject          =                       # 결함 주입(쉼표 구분):
                                        #   init_fail, acq_short, wrote_drop,
                                        #   dma_timeout, shopen_corrupt, tc_timeout

[hardware]
backend         = sim                   # sim | archon
                                        # 실제 CCD 구동 시 archon으로 전환 (DevNote 9장)

[auxcontrol]
# KMTNet AUX control software 와의 TCP 연동.  레거시에는 없던 경로다.
# 규격: TCSAgent/__reference/KMTNet AUX control remote commands(v20140908).pdf
#   요청  <telescope_id> <system> <packet> <SUBSYSTEM> <COMMAND>\n
#   응답  <telescope_id> <system> <packet> <RESPONSE>\n
enabled         = false                 # true 로 켜야 접속을 시도한다

# 아래 네 줄은 TCSAgent 의 pctcs.kmtn*.ini 와 키 이름·형식이 같다.
# 같은 AUX 서버를 가리키므로 그쪽 설정을 그대로 복사해 넣을 수 있다.
# 값 뒤의 "(Local)" 같은 괄호 설명은 무시된다 (첫 토큰만 읽는다).
#
#   사이트 실제값:  KMTNC 192.168.14.60 / KMTNS 192.168.13.60 / KMTNA 192.168.15.60
AUX_Host        = 127.0.0.1 (Local)
AUX_Port        = 5752
AUX_TelID       = KMTNET                # !! 틀리면 서버가 응답 자체를 안 한다
AUX_SysID       = AUX                   # 규격상 고정

packet_prefix   = ICS                   # 패킷 ID 접두어 -> ICS1, ICS2, ...
packet_id       =                       # 채우면 이 값을 고정 사용 (예: 00)
verbose         = false                 # true 면 성공(OK)도 콘솔에 표시

connect_timeout = 3.0                   # 접속 시도 제한
ack_timeout     = 1.0                   # 응답 대기.  넘으면 경고만 남기고 진행
reconnect_sec   = 2.0                   # 재접속 최초 간격 (실패할수록 2배씩)
reconnect_max_sec = 30.0

# 보낼 커맨드 -- "<SUBSYSTEM> <COMMAND> [인자]" 형식.  비우면 안 보낸다.
#
# !! 이 경로는 하드웨어 트리거의 시뮬레이션용 대체물이다.
#    실제 시스템에는 셔터를 여닫는 SW 명령이 없다 -- HE 박스의 TTL 신호가
#    셔터를 구동하고 AUX 는 LIMIT_SHUT 으로 상태를 읽기만 한다(문서 4-2).
#    SET_SH 는 하드웨어 없이 시험하려고 AUX 에 새로 넣은 명령이라 v20140908
#    문서에 없다.  실기(backend=archon)로 가면 enabled=false 로 끌 것.
hello_cmd       =                       # 예: ALL ECHO ics_sim  (문서 1-4)
shopen_cmd      = FILTERS SET_SH OPEN   # -> KMTNET AUX <pid> FILTERS SET_SH OPEN
shclose_cmd     = FILTERS SET_SH CLOSE  # -> KMTNET AUX <pid> FILTERS SET_SH CLOSE

[logging]
level           = info                  # debug | info | warning | error
wire            = true                  # 송수신 메시지를 콘솔에 그대로 출력
file            =                       # 비우면 파일 로깅 안 함
