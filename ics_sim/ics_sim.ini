# ics_sim.ini -- KMTNet ICS simulator configuration
#
# 주석 문자는 '#' 하나이며 줄 어디에나 쓸 수 있다. '#' 앞의 내용은 유효하다.
#   erase_sec = 7.24   # 이렇게 값 뒤에 붙여도 된다
# 값의 근거가 되는 절 번호는 DevNote.md를 가리킨다.
#
# CLI 인자는 같은 키를 덮어쓴다:  python -m ics_sim --time-scale 0.1

[node]
site            = ctio                  # ctio | saao | sso | testbed
telid           = KMTC                  # AUXSTATUS TELID 값. ctio=KMTC saao=KMTS sso=KMTA
ics_id          = ICS
ic_ids          = K.IC, M.IC, T.IC, N.IC
cb_ids          = K.CB, M.CB, T.CB, N.CB
master          = K                     # readout 진행률(PCTREAD)을 보고하는 master CCD
guide_ic_id     = G.IC                  # INITIALIZE만 보낸다. ICG 자체는 범위 밖
emit_node_mode  = legacy                # legacy = 노드별 발신 / merged = 전부 ICS 이름
                                        # DevNote 3.1: 둘 다 OBSAgent 필터를 통과해야 한다

[transport]
bind_host       = 127.0.0.1             # 외부 장비(XIS/OBSAgent)와 붙이려면 0.0.0.0
bind_port       = 6600                  # 레거시 IC 계열 관례 포트. 같은 호스트에
                                        # 실제 K.IC 가 있으면 충돌하니 주의
xis_host        =                       # 비우면 direct-reply 모드 (수신 주소로 되돌려보냄)
xis_port        = 6660                  # CTIO 기준 (OBSAgent ISISPort 6660)
send_gap_ms     = 2                     # rate-limited 발신 큐 간격. 레거시 dispatcher 패턴
peer_ttl_sec    = 3600                  # 학습한 피어 주소 유효시간
register_all_nodes = true               # 기동 시 9개 노드 ID 전부로 PING (DevNote 3.1.1)
                                        # false 면 ICS 만 등록 -> kstatus/dmawait/
                                        # datasource 가 도달하지 않는다

[paths]
data_dir        = ./icsdata             # 단일 저장 경로. 레거시 DISK0~3 링은 폐지 (DevNote 6.2)
write_fits      = false                 # true면 astropy로 더미 FITS 생성
fits_shape      = 256, 256              # 더미 이미지 크기 (행, 열)

[timing]
# 단위 초. 전부 XIS 로그 실측 중앙값 (DevNote 4장)
time_scale          = 1.0               # 전체 축척. 테스트는 0.02 등. [obsagent] 창은 축척 제외
go_to_initializing  = 0.81              # go 접수 -> EXPSTATUS=INITIALIZING
initialize_ack      = 0.40              # INITIALIZE -> IC의 Initialization Complete.
erase_sec           = 7.24              # ERASE -> Erase Cycle Complete.
aux_relay_gap       = 0.058             # 4개 IC로 AUXSTATUS 중계 간격
tcs_relay_gap       = 0.029             # 4개 IC로 TCSSTATUS 중계 간격
shutter_open_delay  = 0.15              # SHOPEN -> Shutter=Open
countdown_tick_dark = 5.00              # DARK/BIAS: ICS의 "Remaining=N sec. of M sec."
countdown_tick_shop = 5.217             # OBJECT: K.IC의 "Integration Remaining=N sec."
shutter_to_readout  = 6.00              # Shutter=Closed -> EXPSTATUS=READOUT
acq_to_idle         = 0.40              # 4번째 Acquisition Complete. -> EXPSTATUS=IDLE
                                        #   [obsagent] force_idle/2 (~0.9s) 안에 들어와야 한다
write_delay         = 3.40              # 획득 완료 -> Wrote
ccd_skew            = 0.0, 0.6, 0.7, 1.6    # 저장 완료 시차. ccd_skew_order 순서로 적용
ccd_skew_order      = N, T, M, K
tc_query_timeout    = 0.50              # TC AUXSTATUS/TCSSTATUS 응답 대기
tc_timeout_mode     = passthrough       # passthrough = 빈 필드로 중계 (레거시 실측, DevNote 6.5)
                                        # canned      = 내장 텔레메트리로 대체

[readout]
# PCTREAD 진행률 모델. 실측: 6 -> 17 -> ... -> 94 (9틱, +11씩) -> 100
pctread_start   = 6
pctread_step    = 11
pctread_tick    = 3.37
pctread_final   = 100                   # 도달 시 "Acquisition Complete. Disk Transfer Starting."

[obsagent]
# OBSAgent(commands.c/main.c)의 상수. 시뮬이 직접 쓰진 않고,
# 기동 시 [timing] 값이 이 창을 침범하지 않는지 자가검증하는 데 쓴다 (DevNote 3.3)
tick_sec        = 0.045
force_idle      = 40                    # ~1.8 s : Acquisition Complete. 1번째 -> 4번째
force_ready     = 270                   # ~12.2 s : IDLE_3 -> READY
force_fitssaved = 560                   # ~25 s : IDLE_3 -> 4번째 Wrote

[behavior]
strict_legacy   = true                  # 미구현 명령(BIN/ROI/DISPL/STOP/ABORT/MOVIE)을 무응답 처리
bug_compat      = false                 # true면 레거시 커맨드워드 오염을 의도적으로 재현 (DevNote 5장)
send_guide_init = true                  # ICS>G.IC INITIALIZE 발신 여부
console         = true                  # stdin 키보드 인터페이스 사용
inject          =                       # 결함 주입(쉼표 구분):
                                        #   init_fail, acq_short, wrote_drop,
                                        #   dma_timeout, shopen_corrupt, tc_timeout

[hardware]
backend         = sim                   # sim | archon
                                        # 실제 CCD 구동 시 archon으로 전환 (DevNote 9장)

[logging]
level           = info                  # debug | info | warning | error
wire            = true                  # 송수신 메시지를 콘솔에 그대로 출력
file            =                       # 비우면 파일 로깅 안 함
