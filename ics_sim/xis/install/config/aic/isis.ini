#
# ISIS Server Runtime Initialization File -- NEW DEPLOYMENT (AIC)
#
# *** NOT AN ARCHIVED ORIGINAL -- THIS ONE IS OURS TO EDIT. ***
#
# Written 2026-09-03 for the new ICS/ICG (KMTNet CEU upgrade).
# The archived operational configs live in
#   ../ctio/isis.ini  ../saao/isis.ini  ../sso/isis.ini
# and MUST NOT be edited: they are historical evidence of what the
# legacy hub actually ran.  Copy this file to the live location
# instead, e.g. ~/AIC/Config/isis.ini  (see ics_archon/INSTALL.md).
#
# Parser limits -- src/server/loadconfig.c, src/server/isisserver.h:
#   * CFG_BUFSIZE 80, read with fgets(buf,80,fp).  Every line must
#     stay UNDER 79 bytes, COMMENTS INCLUDED.  A longer line is
#     split and the tail is then parsed as a config entry, i.e. a
#     bogus keyword, silently.  Keep this file ASCII.
#   * MAXPRESET 32 UDPPort, MAXSERIAL 16 TTYPort, MAXCLIENTS 64.
#   * Lines starting with '#' or blank are skipped.
#   * No ~ expansion.  Paths must be absolute.
#
# Port map (single source: ics_archon/INSTALL.md):
#   6600 ICS   6601 ICG   6606 TCSAgent   6650 OBSAgent   6660 XIS
#
################################################################

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------

ServerID   XIS
ServerPort 6660

# Absolute path, no ~.  Edit per host.
ServerLog  /home/rtkmtnet/AIC/Logs/isis

# Log date follows OBSDAY (noon-to-noon local) by default, so the
# file name is the observing night.  Uncomment to use UTC instead.
#LogDate UTC

# ---------------------------------------------------------------
# Nodes to ping at startup (max 32)
# ---------------------------------------------------------------
#
# The client table is otherwise DYNAMIC: the hub learns a node only
# after that node has sent something.  Our ICS and ICG register
# themselves at startup (one PING per node id), so these presets
# are a convenience -- they are not required for routing.
#
# Check what the hub actually knows with the HOSTS command:
#   ICS>XIS HOSTS      -> DONE: HOST numHosts=.. host0=.. host1=..
#   ICS>XIS HOST ICG   -> adds Method/udpAddr/udpPort/IdleTime
# WARNING: REMOVE <ID> has no EXEC: guard.  Sending it by mistake
# drops that node from the table until it sends again.

# -- Bench: every program on one host ---------------------------

UDPPort 127.0.0.1 6600
UDPPort 127.0.0.1 6601
UDPPort 127.0.0.1 6606
UDPPort 127.0.0.1 6650

# -- Observatory: fill in the real addresses ---------------------
#
# ICS and ICG MAY SHARE A HOST -- that is exactly why the two ports
# differ.  The legacy hub already did this: .108 appeared twice,
# once at 6600 (ICG) and once at 6606 (TC).
#
#UDPPort 192.168.15.109 6600
#UDPPort 192.168.15.108 6601
#UDPPort 192.168.15.108 6606
#UDPPort 192.168.15.109 6650

# ---------------------------------------------------------------
# Legacy-only -- off by default
# ---------------------------------------------------------------
#
# TTYPort is the VDOS serial link (legacy ICS <-> XIS).  Byte
# corruption and message concatenation were observed only on that
# segment.  The new ICS speaks UDP only: leave this off unless a
# legacy serial node is present.
# Permissions: ../../src/server/00SerialConfig.txt
#
#TTYPort /dev/ttyS0 115200

# The caliban data-transfer agents used port 10601 (one per IC
# machine).  The new ICS/ICG absorb the *.CB nodes, so no 10601
# presets are needed any more.

# ---------------------------------------------------------------
# Runtime
# ---------------------------------------------------------------

Verbose

# 'Instrument' hits a buggy branch in loadconfig.c and ends up
# holding the previous entry's value.  Harmless, nothing reads it.
Instrument KMTK
