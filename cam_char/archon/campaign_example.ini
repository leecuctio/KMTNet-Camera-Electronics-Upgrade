# campaign_example.ini -- KMTNet-CEU Archon lab acquisition campaign file
#
# Replaces the hand-edited configuration block + main script of v1.0
# (DATA_PREFIX / UNIT_* / GetDataset() call list).  Copy this file per
# campaign and run:
#
#   python3 archon_kmtnet_labtest_v2.py my_campaign.ini --dry-run   # check plan
#   python3 archon_kmtnet_labtest_v2.py my_campaign.ini             # acquire
#   python3 archon_kmtnet_labtest_v2.py my_campaign.ini --run u23_fast

[unit]
# Data file prefix, unit ID digit, and controller IP (v1.0: DATA_PREFIX/UNIT_*)
prefix = AC13A
id = 7
host = 10.0.0.13

[storage]
# Named storage roots; [run:*] sections refer to these by name.
a = H:/DATA
b = L:/DATA
c = C:/DATA

[acf]
# Named ACF paths; [run:*] sections refer to these by name.
fast_med = acf/KMTNet_Sci_fast_med_U13.acf
comp_med = acf/KMTNet_Sci_comp_med_U13.acf
slow_med = acf/KMTNet_Sci_slow_med_U13.acf

[options]
# verify_acf:      read every config line back (RCONFIG) and diff after upload
# use_fast_params: HOLDTIMING/FASTPREPPARAM/RELEASETIMING exposure start;
#                  set false to fall back to the v1.0 LOADPARAMS sequence
#                  (e.g. if the firmware rejects FASTPREPPARAM)
# readout_timeout: seconds allowed beyond IntMS before declaring a hang
verify_acf = true
acf_retries = 4
use_fast_params = true
poll_interval = 0.5
readout_timeout = 240
power_timeout = 20
progress = true

[notify]
# Optional webhook (Slack/Mattermost/generic JSON {"text": ...}).
# Leave empty to log-only (replaces the disabled Twilio SMS of v1.0).
webhook =

# One [run:NAME] section per dataset, executed in file order.
# dataset_id encodes [UnitID][TestSetup(2)][DatasetType]; the last digit
# selects the dataset plan: 1=xTalk 2=Dark 3/4=iFlat 5=GxT.

[run:u23_fast_xtalk]
acf = fast_med
dataset_id = 3211
storage = b
start_num = 0

[run:u23_comp_xtalk]
acf = comp_med
dataset_id = 3511
storage = b
start_num = 0

[run:u23_slow_xtalk]
acf = slow_med
dataset_id = 3811
storage = a
start_num = 0
