# icg_archon.ini -- 실기 ICG (guide 유닛) 설정
#
# `ics_sim` 계열 절([node]/[site.*]/[timing] 등)과 icg 전용 절([icg]/[hk]/
# [radionode])이 한 파일에 있다 -- 로더가 같은 파일을 두 번 읽는다
# (ics_archon.ini 와 같은 구조).  `~` 는 펼쳐진다.  상대경로는 권하지
# 않는다 -- 실행 디렉터리 기준으로 풀린다.

[node]
observatory  = KASI                 # 사이트를 정하는 단 하나의 값 (D-020)
                                    #   CTIO | SSO | SAAO | KASI -- 넷 밖은 기동 거부
ics_id       = ICG                  # 이 노드의 이름 (레거시 ICG 계승)
ic_ids       = G.IC                 # guide IC 논리 노드 (내부화 -- 수신 등록용)
cb_ids       = G.CB
master       = G
guide_ic_id  =                      # ⚠️ 비워 둔다 -- 기본값 G.IC 를 지우지
                                    #   않으면 라우터가 자기 IC 를 "범위 밖
                                    #   guide" 로 무시한다 (nodes.Role.GUIDE)

[transport]
bind_host    = 127.0.0.1            # ABC/TC/XIS 와 붙이려면 0.0.0.0
                                    #   (레거시 배치상 셋 다 다른 호스트다)
bind_port    = 6601                 # ⭐ **ICG 몫으로 배정한 포트** (2026-09-03).
                                    #   ICS 는 6600 이고 `ics_sim` 기본값도 6600
                                    #   이라, 비워 두면 **같은 값으로 떨어져**
                                    #   한 호스트에서 둘 다 못 뜬다(뒤에 뜨는
                                    #   쪽이 bind 실패).  기동 검사가 알린다.
                                    #   ⚠️ 레거시는 IC 계열·ICG 가 다 6600 이고
                                    #   **호스트로** 갈랐다 -- 다만 같은 호스트에
                                    #   포트 둘을 쓰는 것도 이미 관례였다
                                    #   (허브 preset 에 `.108` 이 6600(ICG)·
                                    #   6606(TC) 두 줄).  배정표는 INSTALL.md.
                                    #   ⚠️ **허브 배치도 함께 고쳐야 한다** --
                                    #   XIS `isis.ini` 의 `UDPPort <ip> 6600`
                                    #   preset 이 이 포트를 가리켜야 기동 핑이
                                    #   닿는다 (동적 등록은 우리 PING 으로 되니
                                    #   치명적이지는 않다).
#xis_host    = 127.0.0.1

[paths]
data_dir     = ~/AIC/data/guide     # guide raw 저장 자리.  gmon 의 감시
                                    #   디렉토리(run/incoming)와 이어지는
                                    #   배치는 운영 몫이다
expnum_file  =                      # 비우면 ini 옆 icg_archon.expnum --
                                    #   science 와 자동으로 갈린다 (9.2절
                                    #   "카운터 독립" 제안)

[camera]
#instrume    =                      # 비우면 '<SITE코드> Guide CCD' (10.3절
                                    #   초안 -- OI-24 확정 대기)
#fpaid       =                      # guide 조립체 귀속 미확정 (OI-24)
#camver      = CEU-v2.1

[controllers]
ctrl1_id     = KMTK-GUI-162         # 벤치기.  관측소는 <SITE>-GUI-161
ctrl1_sn     = STA-0201
ctrl1_cfg    =                      # 비우면 [icg] acf 에서 파생 (5.5절 규칙)
#rdmode      =                      # 비우면 UNKNOWN (guide ACF 이름에 속도
                                    #   토큰이 없다 -- 10.3절)

[icg]
ctrl_host    = 10.0.0.162           # guide 컨트롤러 IP (ID 숫자 = IP 규칙).
                                    #   ⚠️ 정본은 **ACF 의 `IP=` 키**다 (APPLYALL
                                    #   이 컨트롤러에 심는 값) -- R2610 은
                                    #   `IP=10.0.0.162` 이고 science 벤치기 둘도
                                    #   같은 대역이다(10.0.0.101 · .113).
                                    #   종전 값 192.168.1.162 는 근거가 없었다
acf          = acf/KMTK_GUI_162_STA0201_R2612.acf
apply_acf    = true
poweron_wait = 12.0
telemetry    = true
exptime_min  = 2.0                  # EXPTIME 하한 [s] -- **대체값이다.**
                                    #   정본은 ACF 타이밍 스크립트에서 계산한
                                    #   최소 주기다 (icg_archon/acftiming.py):
                                    #   NoIntMS + 트랜스퍼 6.8 + 독출 1244.
                                    #   현행 ACF(R2610, NoIntMS=0 · Pixels=540) 는 1.251 s
                                    #   -- 코드는 ACF 를 읽어 따라가므로 이
                                    #   줄을 고칠 필요가 없다.  ACF 를 못
                                    #   읽을 때만 쓴다.
                                    # ⚠️ 독출 1244 ms 가 하한에 드는 것은
                                    #   독출이 노출을 막아서가 아니다 --
                                    #   frame-transfer 라 image 는 독출
                                    #   중에도 적분한다(규격 10.1-5).  다음
                                    #   트랜스퍼가 store 가 빌 때까지 못
                                    #   와서 주기의 바닥이 되는 것이다.
                                    # ⚠️ 하한보다 짧게 요청하면 **거부하지 않고
                                    #   하한으로 담는다** (운영자 확정
                                    #   2026-08-31).  그때 헤더 EXPTIME 은
                                    #   요청값이 아니라 실현값이다
                                    # ⚠️ 계산이지 실측이 아니다 -- 첫 구동에서
                                    #   대조할 것.  (종전 "실효 하한 = 하한 +
                                    #   FETCH" 는 FETCH 가 독출을 멈춘다는 8.9
                                    #   전제였고 2026-09-02 실측으로 폐기 --
                                    #   실효 하한 = 하한.  DevNote 10.5 · 9.12)
frame_timeout = 60.0                # guide 프레임은 작다 (8.3 MiB)
fetch_timeout = 1.0                 # FETCH 한 프레임의 상한 [s] = **잠금 상한**.
                                    #   8.3 MiB ≈ 0.08 s (science 실측 99~107
                                    #   MiB/s 를 옮긴 값 -- ⚠️ guide 링크는 첫
                                    #   구동 FETCH 로그로 확인) 라 12배 여유.
                                    #   ⚠️ 프레임 하한(1.251 s) **아래여야 한다**
                                    #   -- 잠금이 주기를 넘으면 엔진이 잠긴 버퍼를
                                    #   피해 나머지로만 돌아 못 받은 장이 덮인다
                                    #   (DevNote 10.6 -- science 2버퍼 실측; guide
                                    #   는 3버퍼라 거동은 ⏳ 첫 구동 실측).  0 은
                                    #   크기 유도(60 s)라 걸린다.  기동 검사가
                                    #   어긋나면 알린다.
fetch_buffers = 2
lock_buffer   = true
expenable_file =                    # 노출 잠금(EXPENABLE) 기록.  비우면 이 ini
                                    #   옆 icg_archon.expenable (expnum 과 같은
                                    #   관례 -- -c 로 여러 구성을 나란히 돌려도
                                    #   섞이지 않는다).
                                    #   ⭐ 초점면 작업 중 노출을 막는 지속
                                    #   플래그다.  콘솔: EXPENABLE OFF / ON
                                    #   (TRUE/FALSE 도 받고 인자 없으면 조회).
                                    #   ⚠️ 기동 판정은 **이 노출 잠금 기록
                                    #   파일의 상태**로 갈린다:
                                    #     · 파일이 **아예 없다**(첫 구동 --
                                    #       아무도 잠근 적이 없다는 뜻) → 허용
                                    #     · 파일은 **있는데 못 읽거나** 값이
                                    #       어휘(ON/OFF/TRUE/FALSE) 밖 →
                                    #       **금지로 기동한다**.  잠금 상태를
                                    #       모를 때 허용으로 뜨면 잠금이
                                    #       조용히 풀린다
                                    #   ⚠️ science(ICS)는 막지 않는다 -- 초점면
                                    #   작업 중 그쪽은 사람이 지킨다.
recheck_after_fetch = true
gauge_off_method = diopower         # ⭐ **이온게이지(MKS 356)를 끄는 갈래**.
                                    #   왜 끄나: 게이지 필라멘트가 science
                                    #   영상을 오염시킨다(운영자 2026-09-04).
                                    #   그래서 게이지 Off 는 예외가 아니라
                                    #   **science 노출 중의 평상 상태**이고,
                                    #   끄는 명령(VACGAUGE OFF)은 ICS 가
                                    #   노출 전에 ICG 로 보낸다.
                                    #   ionen    = MOD10\DIO_SOURCE3 1->0
                                    #              (IONEN 한 라인만 HIGH->LOW.
                                    #              MKS 매뉴얼 p.31 의 "pin 1 을
                                    #              pin 5 에 접지해야 이온게이지가
                                    #              동작" 하는 그 스위치다)
                                    #   diopower = MOD10\DIO_POWER 1->0
                                    #              (DIO 8라인 **전부**의 버퍼
                                    #              전원.  ⚠️ 게이지 시리얼
                                    #              3선도 죽어 압력 읽기까지
                                    #              멈춘다)
                                    #   ✅ **diopower 가 실측으로 확인됐다**
                                    #   (운영자 2026-09-04: DIO_POWER=1/0 으로
                                    #   On/Off 제어 확인).  선임이 쓰던 길과도
                                    #   같다(…_goff_….acf 가 그 한 줄만 다름).
                                    #   ⏳ ionen 은 **여전히 미검증**이다 --
                                    #   고르면 기동이 경고한다.
                                    #   ⛔ 끈 동안 DEWPRES 는 sentinel 9.99e-9
                                    #   다 -- 모듈이 Conductron 값을 계속
                                    #   내보내는데 그 바닥값이 인정 범위를
                                    #   통과해 **정상으로 보이는 틀린 값**이
                                    #   되기 때문이다 (DevNote 11.19)

[hk]
interval     = 60.0                 # ⭐ **ICG 쪽 HK 취득·기록 주기** [s]
                                    #   (운영 확정 1분).  ⚠️ ICS 쪽 짝은
                                    #   ics_archon.ini 의 [archon]
                                    #   monitor_interval (기본 20초)이고
                                    #   둘은 **따로** 정한다
log_dir      = ~/AIC/log            # hk.G.<날짜>.csv + hk_latest.G.json
latest_name  = hk_latest.G.json     # ⚠️ **`ics_archon.ini` 의 [archon]
                                    #   hk_latest 와 같은 파일을 가리켜야
                                    #   한다** -- 한쪽만 바꾸면 science 의
                                    #   5.6절 HK 카드가 조용히 전부 sentinel
                                    #   이 된다 (그쪽 기동 검사가 알린다)
query_aux    = true                 # ENS1~7 을 로그에 싣는다 -- **질의는
                                    #   안 한다**(취득 경로가 받아 둔 마지막
                                    #   AUX 응답을 읽기만).  주기 질의는
                                    #   취득 경로의 대기표와 겹쳐 헤더 AUX
                                    #   블록을 비운다 (2026-08-31 교차검토)

[radionode]
backend      = off                  # off | openapi | sim | local_lns
                                    #   ⚠️ 기본이 off 인 이유: 값이 없으면
                                    #   HEBOX/FSATEMP/FSAHUM 이 규격 5.0절
                                    #   sentinel 로 실린다 -- "모른다"가
                                    #   정직하게 남는다.  sim 은 고정 상수를
                                    #   내므로 **헤더 경로로는 안 나간다**
                                    #   (배선 확인용).
                                    #   openapi 로 바꾸려면 아래 네 값을
                                    #   Tapaculo365 콘솔의 "OPENAPI 매뉴얼"
                                    #   에서 옮겨 적는다 (관리자 이름 →
                                    #   고객사 정보 변경 → API KEY/SECRET).
                                    #   ⭐ 절차 전체는 README 의 "Radionode
                                    #   자격증명" 절.
                                    #   ⛔ **실제 KEY/SECRET 을 저장소의 이
                                    #   파일에 적지 말 것** -- 벤치 설치본
                                    #   (~/AIC/etc/icg_archon.ini)에만.
                                    #   한 번 커밋되면 이력 재작성 없이는
                                    #   못 뺀다
                                    #   ⭐ **런타임에도 켤 수 있다** --
                                    #   `RADIONODE CONNECT` 가 off -> openapi
                                    #   로 올리고 폴링 루프를 띄운다 (자격증명
                                    #   이 모자라면 무엇이 없는지 대고 거절).
                                    #   ⚠️ 그것은 ini 를 안 고치므로 재기동하면
                                    #   여기 값으로 돌아간다 -- 상시로 쓰려면
                                    #   이 줄을 openapi 로 적을 것
                                    #   ⛔ **openapi 는 인터넷이 있어야 한다** --
                                    #   끊기면 HEBOX/FSATEMP/FSAHUM 이 그동안
                                    #   sentinel 이고, 운영자는 그 결측을
                                    #   받아들이지 않는다(2026-09-04 확정).
                                    #   ⏳ local_lns = 사설 LoRaWAN 서버에서
                                    #   받는 길(자리만 있다).  게이트웨이를
                                    #   안쪽 LNS 로 돌리면 클라우드 없이
                                    #   받는다 -- 선행 조건 둘(게이트웨이
                                    #   관리 접근 · 장치 가입 키)은 README
                                    #   "인터넷이 안 되는 사이트" 절
poll_period  = 60.0
stale_after  = 600.0                # 이보다 낡은 표본은 헤더에 안 싣는다
                                    #   (장치 SEND INTERVAL 의 ~3배)
#base_url     = https://…           # 콘솔 매뉴얼의 base URL
#latest_path  = /…/{mac}/…          # 최신 측정값 endpoint ({mac} 치환)
#api_key      =
#api_secret   =
#key_header   = X-API-KEY           # 인증 헤더 이름도 ini 소관이다 --
#secret_header = X-API-SECRET       #   콘솔 매뉴얼이 다른 이름을 쓰면 여기서
#timeout      = 10.0                #   ⚠️ 종료 지연 한도이기도 하다 (폴링이
                                    #   진행 중이면 그만큼 더 붙들린다)

[radionode.hebox]
mac          =                      # Radionode365 장치 목록의 MAC/시리얼
keys         = hebox                # 이 장치가 채우는 HK 키 (HEBOX 카드)

[radionode.fsa]
mac          =
keys         = fsatemp, fsahum      # FSA 온·습도 (FSATEMP/FSAHUM 카드)

[behavior]
console      = true

[logging]
#file        = ~/AIC/Logs/icg_archon.log
