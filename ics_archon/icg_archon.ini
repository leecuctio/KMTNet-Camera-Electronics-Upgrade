# icg_archon.ini -- 실기 ICG (guide 유닛) 설정
#
# 한 파일에 `ics_sim` 계열 절([node]/[site.*] 등)과 ICG 전용 절([icg]/[hk]/
# [radionode])이 같이 있다 -- 로더가 같은 파일을 두 번 읽는다.  `~` 는 펼쳐진다.
# ⚠️ 상대경로는 실행 디렉터리 기준으로 풀리니 쓰지 말 것.
#
# ⭐ **주석은 한 줄이 원칙이다** -- 값의 뜻·단위·금지만 적는다.
#    `(→ 11.64)` 는 "왜 그 값인지는 DevNote 그 절에 있다" 는 표시다.

[node]
observatory  = KASI                 # 사이트를 정하는 단 하나의 값 (CTIO|SSO|SAAO|KASI, D-020)
ics_id       = ICG                  # 이 노드 이름 (레거시 ICG 계승)
ic_ids       = G.IC                 # guide IC 논리 노드 (내부화, 수신 등록용)
cb_ids       = G.CB
master       = G
guide_ic_id  =                      # ⛔ 비워 둘 것 -- 채우면 라우터가 자기 IC 를 무시한다 (→ 11.64)

[transport]
bind_host    = 127.0.0.1            # ABC/TC/XIS 와 붙이려면 0.0.0.0
bind_port    = 6601                 # ⛔ ICS(6600)와 달라야 한다 -- 같으면 뒤에 뜨는 쪽이 bind 실패 (→ 11.64)
xis_host     = 127.0.0.1            # 허브 주소.  비우면 direct-reply.  ⚠️ ICS 와 같은 모드로 맞출 것
xis_port     = 6660                 # 허브 UDP 포트

[paths]
data_dir     = ~/AIC/data/guide     # guide raw 저장 자리
expnum_file  =                      # 비우면 ini 옆 icg_archon.expnum (science 와 자동 분리)

# -- 사이트별 측지값 -- [node] observatory 가 하나를 고른다 ------------------
# ⚠️ '\#' 로 적을 것 (공백 뒤 '#' 는 주석이다)

[site.ctio]
telescop        = KMTNet 1.6m \#1
latitude        = -30:10:01.84
longitud        = +70:48:14.39
elevatio        = 2140

[site.saao]
telescop        = KMTNet 1.6m \#2
latitude        = -32:22:42
longitud        = 339:11:22
elevatio        = 1800

[site.sso]
telescop        = KMTNet 1.6m \#3
latitude        = -31:16:24
longitud        = 210:56:08
elevatio        = 1150

[site.kasi]
telescop        = KMTNet 1.6m \#0
latitude        = +36:23:52.25
longitud        = 232:37:27.81
elevatio        = 103

[site]
# 위에서 뽑힌 절을 덮을 때만 채운다.  보통 비워 둔다.
telescop        =
latitude        =
longitud        =
elevatio        =
origin          =

[camera]
# FITS 'ICS INI' 출처 카드.  비우면 코드 기본값.
detector        =                   # 기본 'e2v CCD47-20'
camver          =                   # 기본 'CEU-v2.1'.  HW·성능 변경 때만 올린다
instrume        =                   # 기본 '<SITE코드> Guide CCDs' (⚠️ science 와 다르다)
fpaid           =                   # 비우면 사이트에서 유도 (KASI=FPA\#0 등, 규격 5.3.1절)

[controllers]
ctrl1_id     = KMTK-GUI-162         # 예비품.  관측소 초기 설치는 <SITE>-GUI-161
ctrl1_sn     = STA-0201
ctrl1_cfg    =                      # 비우면 [icg] acf 파일명에서 파생 (규격 10.3절)
rdmode       = NORMAL               # FITS RDMODE.  ⛔ ACF 이름에서 유도하지 않는다

[icg]
ctrl_host    = 10.0.0.162           # guide 컨트롤러 IP.  ⚠️ 정본은 ACF 의 `IP=` 키다
acf          = ~/AIC/Config/acf/KMTK_GUI_162_STA0201_R2619.acf
apply_acf    = true                 # 기동에서 ACF 를 밀어 넣는다

# -- 전원·게이지 ------------------------------------------------------------
gauge_warmup_wait = 12.0            # POWERON 뒤 이온게이지 예열 대기 [s] (→ 11.63)
gauge_on_start  = off               # 기동 때 게이지를 켤지 (off|on).  ⛔ off 여야 science 노출이 안 오염된다 (→ 11.60)
gauge_off_method = diopower         # 끄는 갈래 (diopower|ionen).  ⏳ ionen 은 미검증 -- 고르면 경고 (→ 11.19)

# -- 취득 -------------------------------------------------------------------
exptime_min  = 1.3                  # 설정 가능한 최소 노출시간 [s].  더 짧게 요청하면 거부 않고 접는다 (→ 11.64)
frame_timeout = 10.0                # 프레임 하나의 상한 [s] (guide 는 8.3 MiB 라 넉넉하다)
fetch_timeout = 1.0                 # FETCH 상한 = **잠금 상한** [s].  ⛔ 기본 노출시간(1.251) 아래여야 한다 (→ 10.6)
fetch_buffers = 2                   # AIC 안의 영상 버퍼 수
lock_buffer   = true                # FETCH 전에 버퍼를 잠근다
recheck_after_fetch = true          # FETCH 뒤 프레임 번호를 되읽어 확인한다
telemetry    = true                 # STATUS 기반 감시·기록을 켠다

# -- 링크 회복 (⭐ 값은 labtest 원본과 같게 맞춘 것이다, → 11.61) ------------
acf_retry       = 4                 # ACF 밀어넣기 재시도.  ⛔ 낮추지 말 것 -- 첫 GO 가 죽는다 (→ 11.54)
connect_retry   = 5                 # 접속 재시도.  ⚠️ 컨트롤러가 자리를 놓는 데 ~10초 걸린다
settle_before   = 0.8               # 재수립에서 **끊고** 쉬는 시간 [s]
settle_after    = 2.0               # 재수립에서 **붙고** 쉬는 시간 [s].  ⚠️ 옛 응답이 새 연결로 흘러든다
latency_warn_ms = 150               # HKDATA 지연을 INFO 로 남기는 임계 [ms].  ⭐ 0 = 전부 (벤치 실측용)

# -- 노출 잠금 --------------------------------------------------------------
expenable_file =                    # 비우면 ini 옆 icg_archon.expenable.  ⛔ 못 읽으면 금지로 기동 (→ 11.64)

[hk]
interval     = 60.0                 # HK 취득·기록 주기 [s].  ⚠️ ICS 쪽 짝(monitor_interval)과 **따로** 정한다
log_dir      = ~/AIC/Logs           # hk.G.<날짜>.csv + hk_latest.G.json
latest_name  = hk_latest.G.json     # ⛔ ics_archon.ini 의 [archon] hk_latest 와 **같은 파일**이어야 한다
query_aux    = true                 # ENS1~7 을 로그에 싣는다 (질의는 안 한다 -- 받아 둔 마지막 응답을 읽기만)

[radionode]
backend      = off                  # off | openapi | sim | local_lns.  런타임 `RADIONODE CONNECT` 로도 켠다 (→ 11.44)
poll_period  = 60.0                 # 폴링 주기 [s].  ⛔ 쿼터가 api_key 당 **분당 10회**다
now_min_age  = 60                   # HKDATA NOW 가 클라우드를 다시 칠 최소 표본 나이 [s] (→ 11.56)
stale_after  = 4000.0               # ⭐ **초기값일 뿐** -- 한 번 읽으면 device_interval x3 으로 바뀐다 (→ 11.44)
base_url     = https://oa.radionode365.com
#api_key      =                     # ⛔ 실값은 **벤치 설치본에만** 적는다
#api_secret   =
#api_path     = /tp365/v1           # 공통 경로.  보통 안 건드린다
#timeout      = 10.0                # ⚠️ 종료 지연 한도이기도 하다

[radionode.hebox]
mac          =                      # 응답의 **device_mac** (device_model 이 RN320-BTH 인지 볼 것)
keys         = hebox                # ⭐ **채널 번호 순서**로 짝짓는다 (keys[0]=CH1 …)

[radionode.fsa]
mac          =
keys         = fsatemp, fsahum      # FSA 온·습도

[behavior]
console      = true                 # 콘솔(keyboard) 입력을 받는다

[logging]
file        = ~/AIC/Logs            # 폴더면 날마다 `icg.<YYYYMMDD>.log` (UTC), `.log` 면 그 파일 하나
verbose     = on                    # off 면 **화면만** 간결 -- 로그 파일은 늘 전부 (→ 11.71)
