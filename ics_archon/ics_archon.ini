# ics_archon.ini -- KMTNet ICS (STA Archon 실기) 설정
#
# 주석은 '#' 하나이고 줄 어디에나 쓸 수 있다 ('#' 앞의 내용은 유효하다).
# CLI 인자가 같은 키를 덮는다:  python -m ics_archon --time-scale 1.0
#
# `ics_archon` 은 `ics_sim` 층을 **내장본(`ics_archon/_vendor`)으로 함께 들고
# 다닌다** -- `ics_sim` 을 설치하지 않아도 이 파일 하나로 돌아간다.  저장소에서
# 개발할 때는 형제 폴더의 원천이 이긴다 (기동 배너의 `ics_sim` 줄이 알려 준다).
#
# ⚠️ **`[archon]` 을 뺀 나머지 절은 `ics_sim.ini` 와 같은 것을 읽는다.**
#    값의 근거·주의사항은 그쪽 주석에 자세히 있으니 함께 볼 것
#    (`../ics_sim/ics_sim.ini`).  여기서는 실기에서 달라지는 것만 풀어 쓴다.

[node]
observatory     = KASI                  # **사이트를 정하는 단일 권위** (FITS OBSERVAT)
                                        #   CTIO | SSO | SAAO | KASI  넷뿐이고,
                                        #   **적은 값이 그대로 OBSERVAT 카드**가 된다.
                                        #   여기서 사이트 코드가 유도된다:
                                        #     CTIO->KMTC  SSO->KMTA  SAAO->KMTS  KASI->KMTK
                                        #   그 코드가 파일명 <SITE> · 좌표([site.*]) ·
                                        #   ORIGIN · INSTRUME('<SITE> 18k CCD') ·
                                        #   TELESCOP · FPAID 를 **함께** 끌고 간다
                                        #   (D-011 · D-017, raw spec 2.2/5.3.1절).
                                        #   ⚠️ 모르는 값이면 **기동을 거부**한다.
                                        #   ⚠️ D-017(2026-08-25): 구 TESTBED/KMTT 폐지.
                                        #      벤치 설치본이 TESTBED 로 남아 있으면
                                        #      **기동이 멈춘다** -- KASI 로 고칠 것.
                                        #   ⚠️ 실기를 관측소에 놓으면 이 줄부터 고친다.
                                        #      KASI 로 둔 채 찍으면 실화소가
                                        #      KMTK.… 이름으로 아카이브에 들어간다.
                                        #   ⚠️ 종전의 호스트 IP 판정(site_from_ip, D-015)은
                                        #      폐지됐다 -- 이 줄이 정본이다
ics_id          = ICS
ic_ids          = K.IC, M.IC, T.IC, N.IC
cb_ids          = K.CB, M.CB, T.CB, N.CB
master          = K                     # PCTREAD 를 보고하는 master CCD
                                        #   -> 그 chip 의 컨트롤러(MK)에서 진행률을 읽는다
guide_ic_id     = G.IC                  # INITIALIZE 만 보낸다.  ICG 는 범위 밖
emit_node_mode  = legacy                # legacy | merged (DevNote 3.1)

[transport]
bind_host       = 127.0.0.1             # OBSAgent 와 붙이려면 0.0.0.0
bind_port       = 6600
xis_host        =                       # 비우면 direct-reply
xis_port        = 6660
send_gap_ms     = 2
peer_ttl_sec    = 3600
register_all_nodes = true
broadcast_dedup_sec = 2.0

[paths]
data_dir        = ~/AIC/data           # raw pair 저장 경로 (운영자 확정 2026-08-23).
                                        #   '~' 는 펼쳐진다.  파일 하나가 344 MiB 라
                                        #   노출 1회가 688 MiB (MK+NT) 다.
                                        #   **심볼릭 링크로 바꿔도 된다** -- 프로그램은
                                        #   매번 이 경로를 다시 해석하고, 임시 파일
                                        #   (.part)과 최종 파일이 같은 디렉터리라
                                        #   파일계통을 넘는 rename 이 없다.
                                        #   단 링크 대상이 **먼저 있어야** 한다
                                        #   (끊긴 링크면 makedirs 가 거부한다)
write_fits      = false                 # **시뮬 백엔드만 본다** -- archon 백엔드는 이
                                        #   값과 무관하게 항상 실파일을 쓴다.
                                        #   ⚠️ 종전에는 이 플래그가 D-016 이름 충돌
                                        #   선검사까지 잠갔다(시퀀서가 게이트로 썼다)
                                        #   -- false 로 실기를 돌리면 같은 이름을
                                        #   조용히 덮어썼다.  2026-08-23 에 게이트를
                                        #   백엔드 속성(writes_files)으로 옮겼다
fits_shape      = 256, 256              # 〃 (시뮬 전용).  실기 기하는 [archon] naxis1/2
expnum_file     =                       # 비우면 이 파일 옆에 ics_archon.expnum

# --- 사이트 측지값 (FITS LATITUDE/LONGITUD/ELEVATIO/TELESCOP) ---------------
# ⚠️ LONGITUD 는 **서경 양수**다.  동경으로 "고치면" 부호가 뒤집힌 좌표가
#    아카이브에 영구히 박힌다 -- 자세한 경고는 ics_sim.ini 참조.

[site.ctio]
telescop        = KMTNet 1.6m \#1     # '\#' 로 적을 것 (공백 뒤 '#' 는 주석)
latitude        = -30:10:01.84
longitud        = +70:48:14.39
elevatio        = 2140

[site.saao]
telescop        = KMTNet 1.6m \#2
latitude        = -32:22:42
longitud        = 339:11:22
elevatio        = 1800

[site.sso]
telescop        = KMTNet 1.6m \#3
latitude        = -31:16:24
longitud        = 210:56:08
elevatio        = 1150

[site.kasi]
# KASI(실험실)는 실재 관측 좌표가 없다.  **일부러 비워 둔다** -- sentinel 이
# 실린다.  telescop 만 값이 있다 -- D-017 항목 6 (raw spec 5.3.1절).
# 비워 두면 코드가 사이트 표에서 'KMTNet 1.6m #0' 을 유도하므로 여기는 비운 채
# 두어도 된다.  적을 때는 '\#' 로 -- 공백 뒤 '#' 는 인라인 주석으로 잘린다.
telescop        =
latitude        =
longitud        =
elevatio        =

[site]
# 선택된 [site.<코드>] 를 덮을 때만 채운다.  보통 비워 둔다.
telescop        =
latitude        =
longitud        =
elevatio        =
origin          =

[camera]
# FITS DETECTOR/CAMVER/INSTRUME/FPAID -- 'ICS INI' 출처 카드.  비우면 코드 기본값.
detector        =                       # 기본 'e2v CCD290-99'
camver          =                       # 기본 'CEU-v2.1'.  HW·성능 변경 때만 올린다
instrume        =                       # 기본 '<SITE> 18k CCD'
fpaid           =                       # 비우면 사이트에서 유도한다 --
                                        #   CTIO=FPA\#2 SSO=FPA\#1 SAAO=FPA\#3
                                        #   KASI=FPA\#0 (raw spec 5.3.1절, D-017 항목 6).
                                        #   ⚠️ 망원경 번호와 FPA 번호는 관측소 셋 모두
                                        #   어긋난다 -- 맞추면 검출기 귀속이 틀어진다

[controllers]
# FITS CTRL1*/CTRL2* -- **채우면 INI 가 백엔드 보고값을 이긴다.**
#   ctrl<n>_id  : 운영이 붙인 이름.  컨트롤러는 이것을 모른다
#   ctrl<n>_sn  : 백플레인 시리얼.  비우면 SYSTEM 의 BACKPLANE_ID 가 실린다
#   ctrl<n>_cfg : 적용된 ACF 이름.  비우면 [archon] acf_* 의 파일명이 실린다
#
# ⚠️ **색인 1 = MK, 2 = NT** 다.  [archon] n_controllers = 1 이면 **어느 쪽
#    한 대인지를 이 선언이 정한다** -- ctrl1_id 가 있으면 MK, ctrl2_id 가
#    있으면 NT.  둘 다 선언하면 기동을 거부한다(어느 쪽인지 정할 수 없다).
#
# ⚠️ **"없음" 은 비워 두거나 NC 다** -- NC 는 헤더에 실릴 규격 5.0절 sentinel
#    과 같은 낱말이라 적은 것이 그대로 카드가 된다.  1대 운영은 두 방식:
#        ctrl1_id = KMTA-SCI-101   /  ctrl2_id =        (한쪽만)
#        ctrl1_id = KMTA-SCI-101   /  ctrl2_id = NC     (둘 다, 한쪽 NC)
#    어느 쪽이든 **헤더 카드는 빼지 않고 값에 규격 5.0절의 sentinel 'NC' 가
#    실린다.**  카드를 빼면 pair 두 파일의 카드 수가 달라져 converter 와 견본
#    대사가 그것을 구조 변경으로 읽는다.
# 실값 원자료: raw_fits_spec/__reference/Archon_Unit_Info.txt (ID 숫자 = IP)
#
# ⚠️ **ctrl1_cfg/ctrl2_cfg 는 비워 두는 것이 기본이다.**  비어 있으면 아래
#    [archon] acf_mk/acf_nt 경로에서 **폴더와 확장자(.acf/.cfg)를 떼어**
#    채운다 (raw spec 5.5절, v1.8):
#        acf_mk = ~/AIC/Config/acf/KMTC_SCI_101_STA0284_R2608_MK.acf
#             ->  CTRL1CFG = KMTC_SCI_101_STA0284_R2608_MK
#    적어 두면 **손으로 적은 값이 이기고**, 파생값과 다르면 기동에서
#    경고한다 -- 헤더가 주장하는 설정 파일과 실제로 올리는 파일이 갈린
#    자료는 나중에 봐도 드러나지 않는다.  'NC'(없음)도 덮지 않는다.
# ⚠️ **색인이 태그를 정한다 -- 이름 문자열은 절대 읽지 않는다.**
#    색인 1 = ctrl1_* 로 정의한 컨트롤러 = **무조건 MK**
#    색인 2 = ctrl2_* 로 정의한 컨트롤러 = **무조건 NT**
#    이름 끝 번호(101/102/103/104…)는 유닛마다 다르고 **색인과 아무 관계가
#    없다.**  ctrl1_id 에 'NT' 라고 적어도 색인 1 이므로 MK 다.  이름으로
#    유추하면 운영이 이름 한 번 바꾸는 것이 자료의 정체를 바꾼다 --
#    정본은 **배선**(ctrl_mk_host / ctrl_nt_host)이지 이름이 아니다.
ctrl1_id        =                       # 예: KMTA-SCI-101 (번호는 유닛마다 다르다)
ctrl1_sn        =                       # 예: STA-0288
ctrl1_cfg       =                       # 비우면 [archon] acf_mk 에서 파생
ctrl2_id        =                       # 예: KMTA-SCI-104 (번호는 유닛마다 다르다)
ctrl2_sn        =                       # 예: STA-0289
ctrl2_cfg       =                       # 비우면 [archon] acf_nt 에서 파생
rdmode          = NORMAL                # FITS RDMODE (독출 모드 선언).
                                        #   ⭐ **정본 여섯은 전부 NORMAL**
                                        #      (운영자 확정 2026-08-29).
                                        #      ⏳ 09-03 반입분 KMTS_SCI_102 는
                                        #      확인 대기 -- 이름·타이밍 스크립트가
                                        #      같은 꼴이라 같은 결론으로 본다.
                                        #   ⚠️ **비워 두지 말 것.**  비우면 ACF
                                        #      이름에서 유도하는데(fast/comp/slow)
                                        #      현행 이름 규칙에는 그 토큰이 없어
                                        #      늘 실패하고 코드 기본값 'NORMAL' 이
                                        #      실린다 -- 값은 같지만 "확정된
                                        #      NORMAL" 과 "못 알아본 NORMAL" 이
                                        #      구별되지 않는다.  기동에서 경고한다
                                        #   ⚠️ **속도가 다른 ACF 를 올리면 이 줄도
                                        #      함께 고칠 것** -- 안 고치면 헤더가
                                        #      NORMAL 이라고 거짓말한다 (ACF 이름에
                                        #      토큰이 있으면 기동에서 잡아 준다)

# ===========================================================================
# [archon] -- 컨트롤러 배선.  **이 절이 ics_archon 에만 있다.**
# ===========================================================================
#
# "컨트롤러에 어떻게 접속하나" 는 여기, "헤더에 뭐라고 적나" 는 위 [controllers]
# 와 [camera] 다.  겹쳐 보이지만 갈라 둔 것이다 -- 실험실에서 주소를 바꿔도
# 헤더의 정체는 그대로여야 한다.

[archon]
# --- 접속 -----------------------------------------------------------------
# 컨트롤러 기본 주소는 10.0.0.2 이고 호스트는 보통 10.0.0.1 이다 (매뉴얼 p.45).
# 실험실 유닛은 10.0.0.<IP> 체계를 쓴다 (AC13A = 10.0.0.13).
# ⚠️ **현장(kmtnet-sso)은 "100 + 유닛번호" 다** -- KMTK-SCI-113 = 10.0.0.113 ·
#    KMTK-GUI-162 = 10.0.0.162 (ACF 의 `IP=` 키가 정본).  호스트는 광포트
#    np0 = 10.0.0.201 · np1 = 10.0.0.202 다 (INSTALL.md "벤치 네트워크").
# **비워 두면 그 컨트롤러는 없는 것으로 본다** -- 그 파일은 생기지 않는다.
n_controllers   = 2                     # **운영할 컨트롤러 수.  1 또는 2 만 받는다**
                                        #   그 밖의 값이면 기동을 거부한다.
                                        #   1 이면 어느 쪽인지를 [controllers] 의
                                        #   ctrl1_id(->MK) / ctrl2_id(->NT) 선언이 정한다.
                                        #   ⚠️ 1대는 CCD 가 둘뿐이라 OBSAgent 규약을
                                        #      만족하지 못한다 (Acquisition Complete./
                                        #      Wrote 가 4회가 아니라 2회) -- 실험실
                                        #      단독 취득용이다

ctrl_mk_host    =                       # 예: 10.0.0.101  (chip M/K -> 색인 1)
ctrl_nt_host    =                       # 예: 10.0.0.102  (chip N/T -> 색인 2)
port            = 4242
sock_timeout    = 1.0                   # 소켓 recv 상한 [s].  짧은 것이 의도다
connect_retry   = 4

# --- ACF ------------------------------------------------------------------
# ⚠️ **상대경로면 작업 디렉터리 기준이다.**  labtest 가 여기서 가장 많이
#    넘어졌다 -- 못 찾으면 첫 노출 준비에서 멈추고 절대경로·cwd 를 함께 알린다.
acf_mk          =                       # 예: ~/AIC/Config/acf/KMTC_SCI_101_STA0284_R2608_MK.acf
acf_nt          =                       # 예: ~/AIC/Config/acf/KMTC_SCI_102_STA0285_R2608_NT.acf
apply_acf       = true                  # false 면 CLEARCONFIG/WCONFIG/APPLYALL 를
                                        #   건너뛰고 **줄 번호만 파싱해 RCONFIG 로
                                        #   대조**한다.  어긋나면 기동에서 거부한다
                                        #   (안 그러면 노출 시간이 조용히 안 바뀐다)
                                        #   ⚠️ 줄이 맞아도 **이 세션에서 APPLYALL 이
                                        #      없었으면 POWERON 이 ?xx 로 거부된다**
                                        #      (p.51, 2026-09-01 실기 -- DevNote 10.2).
                                        #      REBOOT·전원 재투입 뒤에는 true 로.
acf_retry       = 4
poweron_wait    = 12.0                  # POWERON 뒤 CCD flush 대기 [s] (labtest 24x0.5)
                                        #   ⚠️ 전원 램프가 아니라 **flush** 대기다 --
                                        #   줄이지 말 것.  이 대기 **안에서** STATUS 로
                                        #   POWER=4 를 확인한다 (telemetry=true 일 때만)

# --- 노출 파라미터 슬롯 (ACF 소관이라 ACF 를 바꾸면 함께 확인할 것) --------
param_intms_slot      = PARAMETER2      # WCONFIG 로 고칠 설정 줄
param_intms_name      = IntMS           #   그 줄에 실을 파라미터 이름
param_exposures_slot  = PARAMETER1
param_exposures_name  = Exposures

# --- 텔레메트리 -----------------------------------------------------------
# **false 로 두면 컨트롤러와의 왕복이 labtest v1.0 계보와 완전히 같아진다.**
# 실기에서 이상이 보이면 여기부터 끄고 취득을 지킨다 (Cn_* 는 NC 로 실린다).
telemetry       = true
status_timeout  = 3.0                   # STATUS 응답 상한 [s].  넘기면 이 실행 동안
                                        #   텔레메트리를 끄고 연결을 다시 세운다

# --- 주기 감시·기록 (층 1·2) ----------------------------------------------
# 온도 10 + 레일 7x2 + 바이어스 16채널 V/I 를 주기적으로 떠서 CSV 로 남긴다.
# **헤더용 스냅샷과 다른 자리(ctrl.status_live)에 든다** -- Cn_TEMP/VOLT/CURR
# 의 뜻("노출 개시 시점 값")은 그대로다.
monitor          = true                 # ⚠️ telemetry=false 면 이 값과 무관하게
                                        #   안 돈다 (왕복을 v1.0 계보와 같게 둔다)
                                        #   ⚠️ **접속은 이 값과 무관하다** -- 본편이
                                        #   기동에서 컨트롤러에 붙고 그 뒤에 감시를
                                        #   시작한다.  이 스위치는 CSV 기록과 주기
                                        #   폴링만 끈다.
                                        #   ⚠️ 접속자는 컨트롤러당 하나다 -- 본편이
                                        #   떠 있으면 STA GUI·probe 를 붙이지 않는다
monitor_interval = 20.0                 # 기록 간격 [s].  운영자 확정 수십 초~수 분.
                                        #   FETCH 락(최대 수 분)에 밀려 표본 한둘을
                                        #   건너뛰는 것은 문제로 보지 않는다 --
                                        #   밀린 시간은 lag_ms 열에 남고 몰아서
                                        #   뜨지는 않는다
monitor_log      = ~/AIC/log            # 기록 자리.  ⚠️ [paths] data_dir 밑에 두지
                                        #   말 것 -- 자료와 함께 굴러가 아카이브
                                        #   정책에 걸린다.  파일은 컨트롤러당·날짜당
                                        #   하나: telemetry.<MK|NT>.<YYYYMMDD>.csv
hk_latest        = ~/AIC/log/hk_latest.G.json
                                        # 듀어·환경 HK 원천 -- icg_archon 이 1분
                                        #   주기로 남기는 원자적 스냅샷.  비우면
                                        #   CCDTEMP 등 5.6절 HK 카드가 sentinel.
                                        #   (물리 원천은 guide 유닛 RTD·진공과
                                        #   Radionode -- 접속자 규칙상 icg 몫)
                                        # ⚠️ **`icg_archon.ini` 의 [hk] log_dir +
                                        #   latest_name 과 같은 파일이어야 한다**
                                        #   -- 어긋나면 HK 카드가 전부 sentinel
                                        #   이다.  기동 검사가 파일 유무·나이를
                                        #   본다
hk_stale_after   = 300.0                # 이보다 낡은 표본은 버린다 [s] -- 낡은
                                        #   값이 새 값처럼 실리는 것이 결측보다
                                        #   나쁘다 (icg 주기 60s 의 5배)

# --- 노출·독출 -----------------------------------------------------------
shutter_ctrl    = both                  # TRIGOUTFORCE 를 낼 컨트롤러: MK | NT | both
                                        #   ⚠️ 실기 배선 확인 항목.  셔터 트리거가
                                        #   한 대에서만 나가면 그 태그로 좁힐 것
full_flush_on_erase = false             # ERASE 를 전체 독출 flush 로 (labtest bFullFlush).
                                        #   ⛔ **끈 것이 기본이다** (운영자 확정
                                        #      2026-08-29) -- clock 을 개선해서
                                        #      **별도 erase 없이 바로 노출을 시작**
                                        #      한다.  labtest 도 1년 실사용을
                                        #      bFullFlush=False 로 했다
                                        #   ⚠️ **켜면 노출마다 독출 1회분(실측
                                        #      12.77초 -- 사강 NoIntMS 0.5 가 붙으면
                                        #      13.27초, DevNote 10.4)이 더 붙는다** --
                                        #      실기 ERASE 는 전체 독출이다.  주기가 약 2배
                                        #   켤 때는 **살아 있는 컨트롤러 전부**를
                                        #   비운다 -- 시퀀서는 master 한 번만 부르지만
                                        #   실기는 두 대 다 비워야 한다
lock_buffer     = true                  # fetch 중 프레임 버퍼를 LOCKn 으로 잠근다.
                                        #   **BIGBUF 는 버퍼가 둘뿐이다** -- 다음
                                        #   노출이 이 프레임의 버퍼를 덮는다.
                                        #   ⭐ 실측(2026-09-01, DevNote 10.4): FETCH
                                        #      3.2~3.5초 · 주기 13.27초 -- FETCH 는
                                        #      IDLE+3.4+3.4 ≈ 6.9초에 끝나고 그 버퍼가
                                        #      다시 쓰이는 것은 13.27초 뒤다(여유 ~6초).
                                        #      fetch 중 경계가 걸릴 확률은 ≈26% 라
                                        #      잠금 없이는 그때 덮인다 (10.6).
                                        #      full_flush_on_erase=true 면 노출 1회가
                                        #      프레임 2개를 만들어 소비가 두 배다.
                                        #   ⚠️ labtest 는 2026-05-28 에 LOCK 을 뺐다
                                        #   -- 되돌린 것이다.  ✅ **2026-09-01 실기 종결**:
                                        #      두 FW(1252·1261) 15/15 반영, 대가 0, nolock
                                        #      덮임 2/2 로 지킬 구간 실재.  **true 확정**
                                        #      (DevNote 10.6, archon_lock_fetch_report.md)
                                        #   꺼도 fetch 앞의 프레임 번호 대조는 남는다
                                        #   매뉴얼 p.71 은 LOCK 을 **통상 경로**로
                                        #   적어 두었다 -- "새 프레임이 있으면 호스트는
                                        #   LOCK 을 내려 그 버퍼가 덮이는 것을 막고,
                                        #   그 다음 FETCH 한다"
                                        #   ⚠️ **다만 판정이 아니라 가설의 강도다** --
                                        #      매뉴얼은 2021-02-23 판이고 현행 FW 와
                                        #      **양방향으로 어긋날 수 있다**(문서에
                                        #      있는데 FW 에 없거나 그 반대).  이미
                                        #      반례가 둘 있다(MODn_TYPE 16+ · AD 슬롯).
                                        #      **판단 근거는 실측이다** -- DevNote 8.7
                                        #   ⭐ 기본이 true 인 이유는 **값이 있어서**다
                                        #      -- 대가 0(lock = idle = 368 행/초, 20초
                                        #      잠금도 감속 0) + 지킬 구간 실재(nolock
                                        #      덮임 2/2).  종전 "더 안전한 쪽이라서" 는
                                        #      실기 전의 판단이다 (DevNote 10.6)
                                        #   ⚠️ 엔진은 "다음 **잠기지 않은** 버퍼" 를
                                        #      잡는다(p.71) -- science 는 BIGBUF 라
                                        #      버퍼가 둘이어서 우리가 하나를 잠그면
                                        #      **엔진에 하나만 남는다**.  guide 는 셋을
                                        #      쓰므로 둘이 남는다.  labtest(science)가
                                        #      LOCK 을 뺀 이유가 이것일 수 있다 -- A/B
                                        #      실험에서 가릴 항목(H3).  ✅ 실측: 잠긴 것을
                                        #      피하고, 남는 버퍼가 없으면 **쓰던 버퍼를
                                        #      재사용**하며 만속 유지 (DevNote 10.4).
                                        #      ⚠️ 그래서 잠금은 프레임 주기(13.27초) 안에
                                        #      풀어야 한다 -- 넘으면 다음 장이 덮인다
recheck_after_fetch = true              # fetch **뒤에** 버퍼가 덮이지 않았는지 한 번 더
                                        # 대조한다 (덮였으면 받아 온 자료를 버린다).
                                        #   ⭐ **lock_buffer = false 인 경우 필요할 수
                                        #      있다** -- fetch 앞의 대조는 직전 한 순간만
                                        #      본다.  fetch 자체가 3.2~3.5초 걸리고 그
                                        #      사이에 경계가 걸릴 확률이 ≈26% 라(10.6)
                                        #      그 창은 LOCKn 이 막아 주는데,
                                        #      LOCK 을 끄면 **막는 것이 아무것도 없다.**
                                        #      이 재대조가 그 짝이다
                                        #   값이 거의 안 든다 -- 3~4초짜리 fetch 뒤에 FRAME
                                        #   왕복 하나(ms)를 더 하는 것뿐이고, lock_buffer
                                        #   가 켜져 있으면 절대 안 걸린다
                                        #   ⭐ LOCKn A/B 실험(2026-09-01 종결)을 뜻있게 만들었다 --
                                        #      lock_buffer=false 쪽이 조용히 틀린 파일을
                                        #      쓰는 대신 **덮였다고 크게 운다**
                                        #   ⚠️ 걸리면 받아 온 3.4초치를 버린다.  그래도
                                        #      대안은 두 노출이 섞인 한 장을 경고 없이
                                        #      쓰는 것이라 버리는 쪽이 맞다
                                        #   ⚠️ **둘 다 false 로 두지 말 것** -- 기동
                                        #      교차검사가 알린다
frame_poll      = 0.5                   # FRAME 폴링 간격 [s]
frame_dump      = 0                     # 프레임 대기 중 진단 덤프 간격 [s]. 0 = 끔.
                                        #   labtest FRAME_DUMP_ENABLE 의 자리다 --
                                        #   "노출이 안 걸렸나 / 독출이 안 끝나나" 를
                                        #   가른다(FRAME·POWER·POWERGOOD·TIMER).
                                        #   **정상 취득이 도는 동안은 꺼 둔다** --
                                        #   한 번에 왕복이 셋 는다.
                                        #   ⚠️ 시한 초과 때의 진단 한 장은 이 값과
                                        #   무관하게 **항상** 남는다
frame_timeout   = 300.0                 # 노출 지시 -> 프레임 완료 상한 [s]. 0 = 무한.
                                        #   **없으면 조용히 멈춘다** -- 독출이 시작되지
                                        #   않으면 EXPSTATUS=READOUT 에 갇혀 OBSAgent 가
                                        #   opause 로 간다.  넘기면 레거시와 같은
                                        #   'DMA WAIT TIMEOUT' 오류 경로를 탄다.
                                        #   실측 독출 12.77초 · 주기 13.27초(2026-09-01)
                                        #   의 20배가 넘는다 -- 조일 값 (예 60)
fetch_timeout   = 10                    # FETCH 한 프레임의 상한 [s]. 0 = 크기에서
                                        #   유도(1 MiB/s 가정, 최소 60초 -- 344 MiB
                                        #   면 **344초**).  frame_timeout 과 **별개**
                                        #   의 상한이라 한쪽만 조여도 다른 쪽은 남는다
                                        #   ⭐ 실측 344 MiB 에 **3.2~3.5초**(99~107
                                        #      MiB/s, 두 유닛 2026-09-01).  10초면
                                        #      2.9배 여유.
                                        #   ⚠️ **주기(13.27초) 아래여야 한다** --
                                        #      lock_buffer=true 에서 FETCH 상한이
                                        #      곧 잠금 상한이고, 잠금이 주기를
                                        #      넘으면 엔진이 쓰던 버퍼를 재사용해
                                        #      **다음 장이 덮인다** (DevNote 10.6).
                                        #      종전 30초(2026-08-29)는 그 위험을
                                        #      몰랐을 때의 값이다.  기동 검사가 본다.
                                        #   종전 유도값 344초(fetch_timeout=0)는 실측의
                                        #      약 100배라, 링크가 죽어도 25초 창이 터진
                                        #      한참 뒤까지 매달려 있었다 -- 기본값도
                                        #      10 으로 옮겼다 (2026-09-02)
fetch_buffers   = 2                     # 호스트 수신·저장 버퍼 수 (컨트롤러당).
                                        #   FETCH 가 하나를 빌려 채우고 **저장이
                                        #   끝난 뒤** 돌려준다.  상한이 서므로
                                        #   저장이 밀려도 메모리가 조용히 늘지
                                        #   않고 **기다린 사실이 로그에 남는다**
                                        #   (그 횟수가 0 이면 2개로 충분한 것이다)
                                        #   ⚠️ **wrote_window 와 짝이다** -- 아래
                                        #      참조.  2개 = 컨트롤러당 688 MiB,
                                        #      2대면 1.4 GB
wrote_window    = 25.0                  # OBSAgent force_fitssaved 창 [s] --
                                        #   IDLE 진입 -> 4번째 Wrote (DevNote 3.2).
                                        #   **우리가 만드는 값이 아니라 선언값**이고,
                                        #   fetch_buffers 가 충분한지 판단하는 데
                                        #   쓴다: N x 13.27초 >= 창 - write_delay.
                                        #   ⚠️ 창을 30초로 늘리면 **버퍼도 3개**가
                                        #      필요하다 -- 기동에서 검사한다

shutdown_drain  = 30.0                  # 종료할 때 저장 중인 프레임을 기다리는 상한 [s].
                                        #   0 = 안 기다린다.  저장은 write_delay 뒤에
                                        #   백그라운드로 도는 일이라, 이것이 없으면 종료가
                                        #   **독출을 마친 프레임을 파일 없이 버린다.**
                                        #   전원 차단(POWEROFF)보다 먼저 기다린다
progress_step   = 5                     # PCTREAD 를 몇 % 마다 낼지 (0 = 바뀔 때마다)

# --- 기하 -----------------------------------------------------------------
# 헤더가 **선언하는** 크기이고, fetch 한 바이트 수와 대조하는 기준이다.
# 어긋나면 fetch 앞에서 거부한다 -- 픽셀이 아니라 **바이트**로 비교하므로
# samplemode(32bit 표본, 정확히 2배)도 걸린다.
naxis1          = 19200                 # raw spec 3장 (science 2-chip pair)
naxis2          = 9400
burst_len       = 1024                  # 프로토콜 고정값.  바꾸지 말 것

# ===========================================================================

[archon.rails]
# 전원 레일의 정상(power good) 범위 [V] -- `하한, 상한`.
#
# **적지 않으면 매뉴얼 p.41 기본값**을 쓴다(아래가 그 값이다).  그 값은 전원
# 보드의 저항으로 정해지므로(p.42) 유닛마다 다를 수 있어 덮을 수 있게 뒀다.
# **적은 레일만 덮는다** -- 한 줄 적었다고 나머지 판정이 사라지지는 않는다.
#
# ⚠️ **비대칭이라 ±% 규칙을 쓰면 틀린다.**  음전압은 작은 쪽을 앞에 적는다.
# 이탈은 감시 기록의 rail_flag 열에 남는다 (취득을 막지는 않는다).
#
# p2v5 = 2.1, 2.9
# p5v  = 4.4, 5.6
# p6v  = 5.5, 6.6
# n6v  = -6.6, -5.3
# p17v = 16.4, 17.5
# n17v = -17.7, -16.6
# p35v = 34.3, 36.0

# ===========================================================================

[timing]
# 단위 초.  **실기에서는 시뮬 값이 아니라 실측이 정본이 된다** -- 아래 값은
# XIS 로그 실측(레거시 IC)이므로, Archon 실측이 나오면 그것으로 교체할 것.
time_scale          = 1.0               # ⚠️ 실기는 1.0 이어야 한다.  하드웨어 시간은
                                        #   축척을 따라오지 않는다
go_to_initializing  = 0.81
initialize_ack      = 0.40              # 실기는 ACF 적용·POWERON 이 첫 프레임에서
                                        #   훨씬 오래 걸린다 (시간 창 없는 구간이다)
erase_sec           = 7.24              # ⚠️ **시뮬만 쓴다** (레거시 IC 실측값).
                                        #   실기 ERASE 는 **독출 1회분**(실측 12.77초 ·
                                        #   사강이 붙으면 13.27초, 2026-09-01 -- DevNote
                                        #   10.4)이고,
                                        #   애초에 full_flush_on_erase=false 라
                                        #   실기는 erase 를 하지 않는다
aux_relay_gap       = 0.058
tcs_relay_gap       = 0.029
shutter_open_delay  = 0.15
aux_requery_after_shopen = 1.0          # ⚠️ **지연이자 재질의 문턱**이다 --
                                        #   EXPTIME <= 이 값이면 재질의하지 않는다
                                        #   (규격 5.7.1절 (c) 표).  3.0 -> 1.0
                                        #   운영자 확정 2026-08-25.  벤치 실측 대상
                                        #   (OI-13) -- 바꾸면 문턱도 함께 움직인다
countdown_tick_dark = 5.00
countdown_tick_shop = 5.217
shutter_to_readout  = 6.00
acq_to_idle         = 0.40
write_delay         = 3.40              # 획득 완료 -> Wrote.  실기는 이 뒤에 FETCH +
                                        #   디스크 쓰기가 붙는다 -- 25초 창 실측 대상
ccd_skew            = 0.0, 0.6, 0.7, 1.6
ccd_skew_order      = N, T, M, K
tc_query_timeout    = 0.50
tc_timeout_mode     = passthrough

[readout]
# ⚠️ **archon 백엔드는 pctread_start/step/tick 을 쓰지 않는다** -- 진행률은
#    컨트롤러의 FRAME(BUFnLINES / ACF LINECOUNT)에서 온다.  pctread_final 만 쓴다
#    (그 값에 도달하면 "Acquisition Complete." 를 낸다).
pctread_start   = 6
pctread_step    = 11
pctread_tick    = 3.37
pctread_final   = 100

# --- Acquisition Complete. 를 컨트롤러 프레임별로 낼지 (목 지시 2026-08-24) ---
# false(기본) = 4개를 **같은 이벤트 루프 틱**에 낸다 -- 산포가 사실상 0 이라
#   1.8초 창(force_idle)이 구조적으로 보장된다.  이것이 종전 거동이다.
# true       = 컨트롤러가 끝나는 대로 그 chip 몫을 낸다.  얻는 것은 관측자가
#   "MK 는 끝났고 NT 가 아직" 을 보는 것뿐이고, 대신 4개의 산포가 **두
#   컨트롤러의 실제 시차**가 되어 그 보장이 없어진다.  OBSAgent 는 4개가 언제
#   왔는지를 창 검사 외에는 쓰지 않는다.
#   ⚠️ **실기 시차 실측 뒤에 켤지 정한다** (tools/probe_archon.py 3단계).
acq_per_frame   = false
acq_skew_warn   = 1.0                   # 첫 완료 뒤 나머지가 이 시간 안에 안 오면
                                        #   경고 [s].  1.8초 창보다 안쪽에 둔다 --
                                        #   창을 깨기 전에 알아야 한다.  스위치가
                                        #   꺼져 있어도 시차는 잰다(실측 근거)

[obsagent]
# OBSAgent 상수.  기동 시 [timing] 이 이 창을 침범하는지 자가검증한다 (DevNote 3.3)
tick_sec        = 0.045
force_idle      = 40                    # ~1.8 s
force_ready     = 270                   # ~12.2 s
force_fitssaved = 560                   # ~25 s : IDLE_3 -> 4번째 Wrote
                                        #   ⚠️ 실기의 FETCH+저장이 이 안에 들어가야 한다

[behavior]
strict_legacy   = true
bug_compat      = false
send_guide_init = false                 # ⚠️ **끈다** (2026-08-31) -- 종전에는
                                        #   `G.IC` 가 아무도 안 받는 이름이라
                                        #   무해했지만, 이제 `icg_archon` 이
                                        #   그 노드를 수신 등록한다.  켜 두면
                                        #   science 노출마다 ICG 안으로
                                        #   `INITIALIZE` 가 들어가 남의 상태를
                                        #   건드린다.  레거시에서 이 메시지는
                                        #   ICG->G.IC 내부 통신이었고, 신규
                                        #   설계는 그것을 프로그램 안으로
                                        #   흡수한다(icg_legacy_report 9.2)
console         = true
inject          =                       # ⚠️ 실기에서는 비워 둘 것 -- 결함 주입은
                                        #   시뮬 백엔드에만 뜻이 있다

[hardware]
backend         = archon                # sim | archon
                                        #   sim 으로 두면 컨트롤러를 만지지 않는다 --
                                        #   메시지 층만 돌려 보는 회귀에 쓴다

[auxcontrol]
# ⚠️ **실기에서는 반드시 false 다.**  셔터는 HE 박스 TTL 이 구동하고, AUX 의
#    SET_SH 는 하드웨어 없이 시험하려고 넣은 명령이다 -- 켜 두면 셔터에 구동원이
#    둘 생긴다.  config.validate() 가 이 조합을 경고한다 (DevNote 9.2.2).
enabled         = false
AUX_Host        = 127.0.0.1 (Local)
AUX_Port        = 5752
AUX_TelID       = KMTNET
AUX_SysID       = AUX
packet_prefix   = ICS
packet_id       =
verbose         = false
connect_timeout = 3.0
ack_timeout     = 1.0
reconnect_sec   = 2.0
reconnect_max_sec = 30.0
hello_cmd       =
shopen_cmd      = FILTERS SET_SH OPEN
shclose_cmd     = FILTERS SET_SH CLOSE

[logging]
level           = info                  # debug | info | warning | error
wire            = true
file            =                       # 실기에서는 파일 로깅을 켜 둘 것 --
                                        #   취득 이력이 콘솔 스크롤에만 남으면 안 된다
