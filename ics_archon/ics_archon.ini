# ics_archon.ini -- KMTNet ICS (STA Archon 실기) 설정
#
# 주석은 '#' 하나이고 줄 어디에나 쓸 수 있다.  CLI 인자가 같은 키를 덮는다:
#   python -m ics_archon --time-scale 1.0
# ⚠️ `[archon]` 을 뺀 나머지 절은 `ics_sim.ini` 와 같은 것을 읽는다.
#
# ⭐ **주석은 한 줄이 원칙이다** -- 값의 뜻·단위·금지만 적는다.
#    `(→ 11.xx)` 는 "왜 그 값인지는 DevNote 그 절에 있다" 는 표시다.

[node]
observatory     = KASI                  # ⛔ 사이트를 정하는 **단 하나의 값** (CTIO|SSO|SAAO|KASI, D-020)
                                        #   파일명·좌표·ORIGIN·INSTRUME·TELESCOP·FPAID 가 여기서 갈린다 (→ 11.66)
ics_id          = ICS
ic_ids          = K.IC, M.IC, T.IC, N.IC
cb_ids          = K.CB, M.CB, T.CB, N.CB
master          = K                     # PCTREAD 를 보고하는 master CCD (-> MK 컨트롤러)
guide_ic_id     = G.IC                  # INITIALIZE 만 보낸다.  ICG 는 범위 밖
emit_node_mode  = legacy                # legacy | merged (DevNote 3.1)

[transport]
bind_host       = 127.0.0.1             # OBSAgent 와 붙이려면 0.0.0.0
bind_port       = 6600                  # ⚠️ ICG(6601)와 달라야 한다
xis_host        = 127.0.0.1             # 허브 주소.  비우면 direct-reply
                                        #   ⛔ require_xis=true 와 짝 -- 비우면 기동이 멈춘다
xis_port        = 6660
send_gap_ms     = 2                     # 연속 발신 사이 간격 [ms]
peer_ttl_sec    = 3600                  # 배운 주소를 붙들 시간 [s]
register_all_nodes = true               # 우리 노드 전부를 허브에 등록한다
broadcast_dedup_sec = 2.0               # 같은 브로드캐스트를 이 창 안에서 한 번만

[paths]
data_dir        = ~/AIC/data            # raw pair 저장 경로.  노출 1회가 688 MiB (MK+NT)
write_fits      = true                  # ⚠️ **시뮬에서만 뜻이 있다** -- archon 백엔드는 이 값과
                                        #   무관하게 늘 실파일을 쓴다 (`--no-fits` 도 마찬가지)
fits_shape      = 256, 256              # 〃 (시뮬 전용).  실기 기하는 [archon] naxis1/2
expnum_file     =                       # 비우면 ini 옆 ics_archon.expnum

# -- 사이트별 측지값 -- [node] observatory 가 하나를 고른다 ------------------
# ⛔ LONGITUD 는 **서경 양수**다 -- 동경으로 "고치면" 부호가 뒤집힌 좌표가 박힌다
# ⚠️ '\#' 로 적을 것 (공백 뒤 '#' 는 주석이다)

[site.ctio]
telescop        = KMTNet 1.6m \#1
latitude        = -30:10:01.84
longitud        = +70:48:14.39
elevatio        = 2140

[site.saao]
telescop        = KMTNet 1.6m \#2
latitude        = -32:22:42
longitud        = 339:11:22
elevatio        = 1800

[site.sso]
telescop        = KMTNet 1.6m \#3
latitude        = -31:16:24
longitud        = 210:56:08
elevatio        = 1150

[site.kasi]
telescop        = KMTNet 1.6m \#0
latitude        = +36:23:52.25
longitud        = 232:37:27.81
elevatio        = 103

[site]
# 위에서 뽑힌 절을 덮을 때만 채운다.  보통 비워 둔다.
telescop        =
latitude        =
longitud        =
elevatio        =
origin          =

[camera]
# FITS 'ICS INI' 출처 카드.  비우면 코드 기본값.
detector        =                       # 기본 'e2v CCD290-99'
camver          =                       # 기본 'CEU-v2.1'.  HW·성능 변경 때만 올린다
instrume        =                       # 기본 '<SITE코드> 18k CCD'
fpaid           =                       # 비우면 사이트에서 유도 (규격 5.3.1절)

[controllers]
# 비우면 [archon] acf_mk/acf_nt 파일명에서 파생한다 (규격 5.5절).
ctrl1_id        =                       # MK 컨트롤러
ctrl1_sn        =
ctrl1_cfg       =
ctrl2_id        =                       # NT 컨트롤러
ctrl2_sn        =
ctrl2_cfg       =
rdmode          = NORMAL                # FITS RDMODE.  ⛔ ACF 이름에서 유도하지 않는다

[archon]
# -- 접속 -------------------------------------------------------------------
# ⚠️ 정본은 ACF 의 `IP=` 키다.  **비우면 그 컨트롤러는 없는 것으로 본다.**
n_controllers   = 2                     # 1 또는 2 만 받는다.  ⚠️ 1 은 OBSAgent 규약 밖 (→ 11.66)
ctrl_mk_host    =                       # 예: 10.0.0.101  (chip M/K -> 색인 1)
ctrl_nt_host    =                       # 예: 10.0.0.102  (chip N/T -> 색인 2)
port            = 4242
sock_timeout    = 1.0                   # 소켓 recv 상한 [s].  짧은 것이 의도다

# -- 링크 회복 (⭐ 값은 labtest 원본과 같게 맞춘 것이다, → 11.61) ------------
connect_retry   = 5                     # 접속 재시도.  ⚠️ 컨트롤러가 자리를 놓는 데 ~10초
settle_before   = 0.8                   # 재수립에서 **끊고** 쉬는 시간 [s]
settle_after    = 2.0                   # 재수립에서 **붙고** 쉬는 시간 [s]
acf_retry       = 4                     # ACF 밀어넣기 재시도.  ⛔ 낮추지 말 것 (→ 11.54)

# -- ACF --------------------------------------------------------------------
# ⛔ **둘 다 필수다** -- 비었거나 파일이 없으면 **기동이 멈춘다** (2026-09-12).
#    기동 뒤 **첫 `GO` 의 `prepare()`** 에서(세션마다 한 번) 이 파일을 읽어 컨트롤러를
#    재설정한다(`CLEARCONFIG`+`WCONFIG`+`APPLYALL`).  ⚠️ 기동~첫 GO 사이의 컨트롤러
#    메모리는 앞 세션의 것이거나 부팅 그대로(`Not Configured`)다 (→ 11.94).  guide 는 기동에서 민다.
#    ⚠️ 상대경로면 **작업 디렉터리 기준**이다.
# ⭐ 종전의 `apply_acf` 눈금은 걷었다 -- 적용을 건너뛰면 *"호스트가 읽은 파일"* 과
#    *"컨트롤러 메모리에 든 것"* 이 갈리는데, 줄 번호 대조로는 그 세션에서
#    `APPLYALL` 이 됐는지를 가릴 수 없었다 (매뉴얼 p.51 · → 10.2).
acf_mk          =                       # 예: ~/AIC/Config/acf/KMTC_SCI_101_STA0284_R2613_MK.acf
acf_nt          =                       # 예: ~/AIC/Config/acf/KMTC_SCI_102_STA0285_R2613_NT.acf

# -- 전원 -------------------------------------------------------------------
poweron_wait    = 0.0                   # POWERON 뒤 **추가** 정착 대기 [s].  ⭐ 0 이 확정 (→ 11.65)
                                        #   ⚠️ `POWER=4` 확인은 이 값과 무관하게 늘 한다 (telemetry = true 일 때 --
                                        #      false 면 확인 없이 대기만 한다)
ccdflush_first  =                       # ACF FirstFlush 덮어쓰기 -- 한 LOADPARAMS 묶음의 **첫 장 앞에만** flush
ccdflush_every  =                       # ACF EveryFlush  덮어쓰기 -- **매 노출 앞에** flush
                                        #   ⭐ **비우면 ACF 값을 그대로 따른다** (R2613 초기값은 둘 다 0)
                                        #   ⛔ science 전용 (→ 11.33 · 11.86-(12))
                                        #   ⭐ EveryFlush 는 Exposure: 아래라 continuous 경로는 안 탄다
                                        #   ⚠️ 켜면 프레임 주기가 **+5.54 s** 늘어난다
                                        #      (Prep 0.200 + Flush 5.332 + FlushPostMS 0.010)
                                        #   ⚠️ 둘 다 1 이면 한 노출 앞에 flush 가 **두 번** -- 막지 않는다
                                        #   ⛔ 종전 `ccdflush = true` 는 이제 `ccdflush_every = 1` 이다
full_flush_on_erase = false             # ERASE 를 전체 독출로.  ⛔ 끈 것이 기본 (→ 11.66)

# -- 진공게이지 · guide 노출 잠금 (ICG 로 명령을 보낸다) ---------------------
gauge_off_on_exposure = true            # ⛔ 노출 앞에 게이지를 끈다 -- 필라멘트가 영상을 오염시킨다
icg_node        = ICG                   # ⚠️ guide_ic_id(G.IC)가 아니다.  VACGAUGE·EXPENABLE·HKDATA 가 이 상대에게 간다
hk_query_timeout = 2.0                  # GO 때 ICG 에 HKDATA NOW 를 묻고 답을 기다리는 시한 [s]
                                        #   ⭐ 5.6절 HK 카드의 원천은 **와이어**다 (운영자 2026-09-03 · → 11.90)
                                        #   ⛔ 종전 [archon] hk_latest(파일 스냅샷)·hk_stale_after 는 없앴다 --
                                        #      벤치 ini 에 남아 있어도 읽지 않는다 (지울 것)
                                        #   ⚠️ 넘기면 카드는 sentinel, 노출은 간다 (관측을 막지 않는다)
                                        #   ⭐ ICG 가 **HKDATA 에** ERROR/FATAL 로 답하면 시한을 안 기다리고 곧바로 같은 길이다
                                        #      (HK 거절 -- 콘솔 hk 의 답 -- 은 경고만 하고 이 대기를 안 끝낸다)
gauge_reenable_after = 600.0            # 취득 **종료** 뒤 다시 켜기까지 [s] (셔터 닫힘이 아니다)
gauge_settle_after = 5.0                # 껐을 때 노출 시작까지 [s].  ⛔ VACGAUGE OFF 는 즉시가 아니다
                                        #   ⭐ 껐으면 그 뒤 첫 장 앞에 flush 한 번 -- FirstFlush 가 0 이면
                                        #      그 프레임에만 1 로 (이미 꺼져 있던 GO 는 그대로) (→ 11.93)
gauge_reply_timeout  = 10.0             # ICG 답을 기다릴 시간 [s].  ⚠️ 없으면 "안 꺼진 채 찍는" 상태가 조용하다
GUIEXPCTRL      = true                  # science **독출 앞뒤**로 guide 노출을 자동으로 막는다
                                        #   ⚠️ 이름과 달리 `EXPENABLE` 제어다 (모듈은 expenablectl.py)
guiexp_lead     = 2.0                   # 독출 시작 몇 초 전에 막을지 [s]
phase_poll      = 0.25                  # 국면 감시 루프 주기 [s] -- `_watch_acquisition()`.
                                        #   한 틱에서 **둘**을 본다:
                                        #   ① guide 노출 잠금 -- 국면과 "독출까지 남은 초" 를 보고
                                        #      독출 앞뒤로 ICG 노출을 막는다 (GUIEXPCTRL).
                                        #      ⚠️ 그래서 guiexp_lead 보다 충분히 작아야 한다 --
                                        #      크면 막을 시점을 지나친다
                                        #   ② 이온게이지 되켜기 -- 취득이 끝나는 순간을 잡아
                                        #      gauge_reenable_after 타이머를 건다
                                        #   ⭐ 하한 0.05 s (코드가 클램프)

# -- 허브 · 시계 ------------------------------------------------------------
require_xis     = true                  # ⛔ 기동에서 허브를 확인하고 안 되면 멈춘다 (→ 11.15)
xis_ping_timeout = 2.0                  # PING 한 통을 기다릴 시간 [s]
xis_ping_tries  = 3                     # 몇 번까지 다시 물어볼지 (UDP 는 유실 보상이 없다)
tcs_clock_warn  = 0.5                   # TCS 시계 어긋남 경고 문턱 [s].  0 이면 끈다
                                        #   ⛔ 알리기만 한다 -- 값을 보정하지 않는다

# -- 노출 파라미터 (ACF 에서 **이름으로** 찾는다) ---------------------------
# ⛔ 슬롯 번호 눈금은 걷었다 (운영자 2026-09-12).  `parse_acf()` 가 ACF 를
#    읽을 때마다 `IntMS`·`Exposures`·`FirstFlush` 를 이름으로 찾는다.
# ⭐ **이름 고정은 KMTNet 의 ACF 규약이다** -- Archon 의 제약이 아니다.
#    ACF 를 개정해도 이 셋의 이름은 바꾸지 않는다.  못 찾으면 **`GO` 가 실패한다**
#    -- 기동은 접속만 하므로 안 멈추고, 첫 `GO` 부터 그 `prepare()` 가 ACF 를 민 뒤
#    판정에서 `ERROR` 로 끝난다 (`FirstFlush` 만 경고하고 flush 없이 간다).

# -- 텔레메트리 · 주기 감시 -------------------------------------------------
telemetry       = true                  # false 면 컨트롤러 왕복이 labtest v1.0 계보와 같아진다
status_timeout  = 3.0                   # STATUS 응답 상한 [s].  넘기면 이 실행 동안 끄고 재수립
monitor         = true                  # CSV 기록·주기 폴링.  ⚠️ 접속 자체는 이 값과 무관
monitor_interval = 20.0                 # **ICS 쪽 HK 기록 주기** [s].  ⚠️ guide 쪽 짝은 [hk] interval
monitor_log      = ~/AIC/Logs           # ⚠️ data_dir 밑에 두지 말 것 (아카이브 정책에 걸린다)

# -- 노출·독출 --------------------------------------------------------------
shutter_ctrl    = MK                    # 셔터를 **모는** 컨트롤러: MK | NT | both
                                        #   ⭐ MK 하나가 낸다 (운영자 2026-09-12).  MK 의 Trigger Out
                                        #      이 고장나거나 수명이 다하면 NT 로 전환한다
                                        #   ⭐ 노출마다 두 컨트롤러를 이렇게 세운다:
                                        #        모는 쪽   TRIGOUTFORCE=0 · TRIGOUTLEVEL=0
                                        #                  (= 타이밍 스크립트가 핀을 몬다 = 셔터 노출)
                                        #        안 모는 쪽 TRIGOUTFORCE=1 · TRIGOUTLEVEL=0
                                        #                  (= 우리가 핀을 붙들어 LOW 로 고정)
                                        #      `both` 면 둘 다 "모는 쪽" 이다
                                        #   ⛔ **레벨까지 함께 세운다** -- FORCE 만 쓰면 앞 세션이
                                        #      SHOPEN 중에 죽어 남긴 LEVEL=1 이 그대로 나가 안 모는
                                        #      쪽 핀이 HIGH 로 고정된다
shutter_close_ms = 5200                 # **셔터가 다 닫히는 데 걸리는 시간** [ms] (운영자 2026-09-13)
                                        #   ⭐ 셔터를 여는 IMAGETYPE 에서 EXPTIME 은
                                        #        "셔터가 열리기 시작 ~ 셔터가 닫히기 시작"
                                        #      (= 타이밍 스크립트의 `CALL IntUnit(IntMS)` 완료 시점)
                                        #      이고, **그 뒤 셔터가 다 닫힐 때까지 기다렸다가**
                                        #      독출을 시작해야 한다.  그 대기를 만드는 것이 ACF 의
                                        #      `NoIntMS` 다 (`NOINT; CALL NoIntUnit(NoIntMS)`)
                                        #   ⛔ 이 값은 그 **하한**이다 -- 셔터 노출은 **노출마다**
                                        #      `NoIntMS` = max(ACF 값, 이 값) 을 싣는다.  그 값은 ACF 적용
                                        #      직후(첫 GO) 한 번 정하고, ACF 가 짧으면 그때 **경고**한다.
                                        #      정본은 ACF 다; 경고가 뜨면 ACF 를 고칠 것 (→ 11.85)
                                        #   ⚠️ 짧으면 **셔터가 닫히는 중에 독출이 시작돼** 프레임에
                                        #      빛이 샌다 -- 그리고 그것은 조용하다
                                        #   ⭐ 5200 은 **블레이드 주행 ~5초**에서 온 값이다 (운영자
                                        #      2026-09-13).  같은 크기가 두 자리에 이미 있었다 --
                                        #      `ics_sim/sequencer.py` 의 *"블레이드 주행은 ~5초"* 와
                                        #      시뮬의 레거시 실측 `shutter_to_readout = 6.00 s`
                                        #   ⛔ **현행 science ACF 여덟은 `NoIntMS=500` 이다** -- 그래서 세션마다
                                        #      (첫 GO) 경고가 뜨고 셔터 노출은 5200 을 싣는다.  그것이 설계한
                                        #      동작이고, **ACF 를 고치라는 신호**다 (다음 판 후보)
                                        #   ⏳ 정밀값은 **미실측** -- 벤치 절차는 bench_test_plan 3단계
                                        #      (⚠️ 손 WCONFIG 는 다음 GO 에서 덮인다 -- 이 값을 바꿔 재기동하며 잰다)
                                        #   ⭐ 셔터를 여는 노출에만 붙는다 -- DARK 는 `NoIntMS` = 적분시간, BIAS 는 0
                                        #   0 = 검사하지 않는다 -- 셔터 노출은 **ACF 값**을 싣는다 (⛔ 스캔값으로 쓰지 말 것)
lock_buffer     = true                  # FETCH 중 버퍼를 LOCKn 으로 잠근다.  ⭐ 실기 종결 (→ 10.6)
recheck_after_fetch = true              # FETCH 뒤 덮이지 않았는지 재대조.  ⚠️ 둘 다 false 로 두지 말 것
frame_poll      = 0.2                   # FRAME 폴링 간격 [s] (운영자 2026-09-12).
                                        #   ⭐ 독출 12.77 s 를 **64번쯤** 나눠 본다 -- PCTREAD 진행률과
                                        #      프레임 완료 판정이 그만큼 촘촘해진다 (종전 0.5 는 26번)
                                        #   ⚠️ 왕복이 늘어난다 -- FETCH 락과 다투지는 않지만
                                        #      lag_ms 열이 커지면 이 값을 먼저 본다
frame_dump      = 0                     # 프레임 대기 중 진단 덤프 간격 [s].  0 = 끔
frame_timeout   = 30.0                  # **적분이 끝난 뒤**부터 프레임 완료까지의 상한 [s].  0 = 무한
                                        #   ⭐ 노출 지시가 아니라 `int_until` 부터 센다 (2026-08-28) --
                                        #      그래서 600 s dark 를 걸어도 이 값이 안 걸린다
                                        #   ⚠️ 독출이 12.77 s, ccdflush_first/every 로 flush 가 들면 +5.54 s 다 --
                                        #      30 이면 그 합(18.3)의 1.6배다
fetch_timeout   = 11                    # FETCH 상한 = **잠금 상한** [s] (운영자 2026-09-13).
                                        #   ⛔ **주기(12.78 s) 아래여야 한다** -- LOCKn 을 쥔 채
                                        #      프레임 경계를 넘으면 엔진이 쓰던 버퍼를 재사용해
                                        #      **다음 장을 덮는다** (2026-09-01 실측, DevNote 10.6)
                                        #   ⭐ 실측 FETCH 는 3.2~3.5 s (99~107 MiB/s) -- 11 이면 3.1배
                                        #   ⚠️ 12 -> 11 은 바닥이 13.27 -> 12.78 로 내려간 데 따른 것이다
                                        #      (셔터 재설계로 BIAS 사강이 0, DevNote 11.85-(3)).
                                        #      여유가 1.27 -> 1.78 s 로 오히려 늘었다
fetch_buffers   = 2                     # 호스트 수신·저장 버퍼 수 (컨트롤러당 688 MiB)
wrote_window    = 25.0                  # OBSAgent force_fitssaved 창 [s] -- **선언값**이다
                                        #   ⚠️ 늘리면 fetch_buffers 도 함께 (기동 검사가 본다)
shutdown_drain  = 30.0                  # 종료할 때 저장 중인 프레임을 기다리는 상한 [s]
progress_step   = 5                     # PCTREAD 를 몇 % 마다 낼지 (0 = 바뀔 때마다)

# -- 기하 (헤더가 **선언하는** 크기이자 fetch 바이트 수의 대조 기준) --------
naxis1          = 19200                 # raw spec 3장 (science 2-chip pair)
naxis2          = 9400
burst_len       = 1024                  # 프로토콜 고정값.  바꾸지 말 것

[archon.rails]
# 전원 레일의 정상 범위 [V] -- `하한, 상한`.  적은 레일만 덮는다.
# 안 적으면 매뉴얼 p.41 기본값(아래).  ⚠️ 비대칭이라 ±% 규칙을 쓰면 틀린다.
# p2v5 = 2.1, 2.9
# p5v  = 4.4, 5.6
# p6v  = 5.5, 6.6
# n6v  = -6.6, -5.3
# p17v = 16.4, 17.5
# n17v = -17.7, -16.6
# p35v = 34.3, 36.0

[timing]
# 단위 초.  ⚠️ **실기에서는 실측이 정본**이다 -- 아래는 레거시 IC XIS 로그 실측.
# ⛔ write_delay · ccd_skew 는 여기 두지 않는다 (코드 기본 0, → 11.66)
time_scale          = 1.0               # ⛔ 실기는 1.0 -- 하드웨어는 축척을 안 따른다
go_to_initializing  = 0.81
initialize_ack      = 0.40
erase_sec           = 7.24              # ⚠️ **시뮬만 쓴다** (실기는 erase 를 안 한다)
aux_relay_gap       = 0.058
tcs_relay_gap       = 0.029
shutter_open_delay  = 0.15
aux_requery_after_shopen = 1.0          # ⚠️ 지연이자 **재질의 문턱** (규격 5.7.1절 (c))
countdown_tick_dark = 5.00
countdown_tick_shop = 5.217
shutter_to_readout  = 6.00              # 셔터 노출의 적분 뒤 READOUT 통지까지 **호스트가** 자는 시간 [초]
                                        #      (레거시 IC XIS 로그 실측값)
                                        #   ⛔ **시뮬 전용이 아니다** -- 공유 시퀀서가 자므로 실기(archon)에서도
                                        #      돈다.  셔터 닫힘을 실제로 기다리는 것은 컨트롤러의 `NoIntMS`
                                        #      ([archon] shutter_close_ms, 단위 ms)이고 이 잠은 통지 지연일 뿐이다
                                        #   ⚠️ 줄을 지워도 코드 기본값 6.00 이 쓰인다
acq_to_idle         = 0.40
ccd_skew_order      = N, T, M, K        # (skew 가 0 이라 지금은 순서만 남는다)
tc_query_timeout    = 0.50
tc_timeout_mode     = passthrough

[readout]
# ⚠️ archon 백엔드는 start/step/tick 을 **안 쓴다** -- 진행률은 컨트롤러 FRAME 에서 온다.
pctread_start   = 6
pctread_step    = 11
pctread_tick    = 3.37
pctread_final   = 100                   # 이 값에 닿으면 "Acquisition Complete."
acq_skew_warn   = 1.0                   # 첫 완료 뒤 나머지가 이 안에 안 오면 경고 [s]

[obsagent]
# OBSAgent 상수.  기동에서 [timing] 이 이 창을 침범하는지 자가검증한다 (DevNote 3.3)
tick_sec        = 0.045
force_idle      = 40                    # ~1.8 s
force_ready     = 270                   # ~12.2 s
force_fitssaved = 560                   # ~25 s : IDLE_3 -> 4번째 Wrote

[behavior]
# ⭐ 이 절은 **시뮬 전용이 아니다** -- 여섯 눈금 모두 실기(archon 백엔드)에서도
#    그대로 돈다.  공유층(`ics_sim`)이 읽고 두 프로그램이 같이 탄다.

strict_legacy   = true                  # 미구현 명령(BIN)에 답하지 않는다 (ics_sim DevNote 9.2)
                                        #   false 면 `ERROR ... not implemented yet` 으로 답한다
                                        #   ⚠️ ROI/DISPL/MOVIE 거부는 이 눈금과 상관없이 늘 나간다
console         = true                  # 콘솔(keyboard) 입력을 받는다
verbose         = off                   # off 면 **화면만** 간결 -- 로그 파일은 늘 전부 (→ 11.71)
                                        #   ⭐ 기동값일 뿐 -- `verbose off` 명령으로 그 자리에서 바꾼다

# ⛔⛔ **이 줄을 지우거나 주석 처리하지 말 것** -- 코드 기본값이 `true` 라
#     줄이 없으면 **켜진다** (아래 둘과 정반대다).
#     켜지면 science 노출마다 `INITIALIZE <suffix>` 가 [node] guide_ic_id 로
#     나가고, 그 명령은 받는 쪽의 **파일명 suffix 를 통째로 덮는다**.
#     ⚠️ 지금은 guide_ic_id(G.IC)가 실기 ICG 노드(ICG)와 달라 받는 데가 없지만,
#        누가 그 값을 ICG 로 맞추는 순간 guide 파일 이름이 science 노출마다
#        바뀐다 -- 규격 9.2절이 세운 "guide 카운터는 science 와 독립" 이 깨진다.
send_guide_init = false

# -- 아래 둘은 **실기에서 쓸 일이 없다** (운영자 2026-09-12, 주석으로 남긴다) --
# ⭐ 값이 없어도 동작이 같다 -- 코드 기본값이 `false` / 빈 목록이다.
#    지우지 않고 남기는 이유는 **무엇을 켤 수 있는지 보이게** 하려는 것이고,
#    회귀를 재현할 때 그 자리에서 되살리기 위해서다.
# bug_compat    = false                 # 레거시의 **알려진 결함까지** 흉내낸다 (emitter·impv2)
# inject        =                       # 결함 주입 -- 시험용.  ⛔ 실기에서 켜면 자료가 거짓이 된다

[hardware]
backend         = archon                # sim | archon

[auxcontrol]
# ⛔ **실기에서는 false** -- 셔터 통지(shopen_cmd/shclose_cmd)를 2026-09-12 에 걷어 켜도 실기에서
#    할 일이 없고, 서버가 없으면 재접속 경고만 쌓인다.
enabled         = false
AUX_Host        = 127.0.0.1 (Local)
AUX_Port        = 5752
AUX_TelID       = KMTNET
AUX_SysID       = AUX
packet_prefix   = ICS
packet_id       =
verbose         = false                 # true 면 성공(OK) 줄도 간결 화면에 낸다 (로그 파일에는 늘 남는다)
connect_timeout = 3.0
ack_timeout     = 1.0
reconnect_sec   = 2.0
reconnect_max_sec = 30.0
hello_cmd       =                       # (재)접속할 때마다 붙은 직후 1회 (예: ALL ECHO ics).  비우면 생략
# ⛔ 셔터 제어(shopen_cmd/shclose_cmd)는 걷었다 (운영자 2026-09-12) -- 목적이
#    OBSAgent/TCSAgent 를 통해 AUX 에 **FSA 셔터 제어 명령**을 전달하는 것이었는데
#    TCS 검토로 FSA HW 구현이 어렵다고 판정됐다.
#    ⭐ 셔터는 우리 컨트롤러의 Trigger Out 이 몰고, 명령은 SHOPEN/SHCLOSE 다.

[dome]
# 돔 방위 셋의 원천 -- `DSTELAZ`/`DSAZ`/`DAZERR` (→ 11.79).  돔 제어 프로그램이
# redis 에 실어 두는 값을 **노출 개시 시각에** 읽는다.  ⛔ 키에 TTL(수백 ms)이
# 걸려 있어 **키가 없으면 그 카드는 `NC`** 다 -- 옛 값을 이어 싣지 않는다.
source          = redis                 # off | redis.  ⛔ off 면 세 카드가 늘 NC
host            = 127.0.0.1
port            = 6379
timeout         = 0.3                   # 왕복 상한 [s].  ⚠️ 키 TTL 보다 크게 잡을 이유가 없다
#username       =                       # 인증 걸린 서버만.  비우면 AUTH 를 안 보낸다
#password       =
db              = 0                     # 0 이 아니면 접속 직후 SELECT
key_tel_az      = dome_tel_az           # -> DSTELAZ  (돔이 보고하는 망원경 방위)
key_az          = dome_az               # -> DSAZ     (돔 셔터 방위)
key_del_az      = dome_del_az           # -> DAZERR   (방위차.  없으면 위 둘로 계산)

[logging]
level           = info                  # debug | info | warning | error
wire            = true                  # 와이어 메시지를 로그에 남긴다
file            = ~/AIC/Logs            # ⭐ **폴더면 날마다** `ics.<YYYYMMDD>.log` (덧붙이기)
                                        #   이름 날짜는 **사이트 관측일**(FITS 파일명과 같은 날짜,
                                        #   관측소는 현지 12:30 · KASI 는 KST 자정에 넘어감), 줄 시각은 UTC
                                        #   `.log` 로 끝나면 그 파일 하나.  실기에서는 켜 둘 것
